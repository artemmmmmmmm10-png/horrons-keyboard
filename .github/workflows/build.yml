          package ru.horrons.keyboard

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Typeface
          import android.os.Bundle
          import android.provider.Settings
          import android.text.Editable
          import android.text.InputType
          import android.text.TextWatcher
          import android.view.View
          import android.view.inputmethod.InputMethodManager
          import android.widget.AdapterView
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Spinner
          import android.widget.Switch
          import android.widget.TextView

          /** Экран настроек: включение клавиатуры, темы, высота, языки, переводчик, Horrons AI. */
          class SettingsActivity : Activity() {

              private lateinit var p: Prefs

              private fun Int.dp(): Int = (this * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  p = Prefs(this)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(16.dp(), 16.dp(), 16.dp(), 32.dp())
                  }
                  val scroll = ScrollView(this)
                  scroll.addView(root)
                  setContentView(scroll)

                  fun title(text: String) = TextView(this).apply {
                      this.text = text
                      textSize = 18f
                      setTypeface(typeface, Typeface.BOLD)
                      setPadding(0, 20.dp(), 0, 8.dp())
                  }

                  fun note(text: String) = TextView(this).apply {
                      this.text = text
                      textSize = 13f
                      setPadding(0, 2.dp(), 0, 6.dp())
                  }

                  root.addView(TextView(this).apply {
                      text = "Horrons Клавиатура"
                      textSize = 26f
                      setTypeface(typeface, Typeface.BOLD)
                  })
                  root.addView(note("Включи клавиатуру в системе, выбери её по умолчанию и проверь ниже."))

                  // 1. Включить / выбрать
                  root.addView(Button(this).apply {
                      text = "1. Включить клавиатуру в настройках"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) }
                  })
                  root.addView(Button(this).apply {
                      text = "2. Выбрать Horrons Клавиатуру"
                      setOnClickListener {
                          (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker()
                      }
                  })
                  root.addView(EditText(this).apply {
                      hint = "Проверь клавиатуру здесь"
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_CAP_SENTENCES
                  })

                  // 2. Темы
                  root.addView(title("Тема"))
                  val group = RadioGroup(this)
                  Themes.all.forEachIndexed { i, t ->
                      group.addView(RadioButton(this).apply {
                          id = View.generateViewId()
                          text = t.name
                          isChecked = i == p.theme
                          setOnClickListener { p.theme = i }
                      })
                  }
                  root.addView(group)

                  // 3. Высота
                  val heightLabel = TextView(this)
                  fun updHeight() {
                      heightLabel.text = "Высота клавиш: ${p.height}%"
                  }
                  updHeight()
                  root.addView(title("Размер"))
                  root.addView(heightLabel)
                  root.addView(SeekBar(this).apply {
                      max = 60
                      progress = p.height - 70
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(sb: SeekBar, value: Int, fromUser: Boolean) {
                              p.height = 70 + value
                              updHeight()
                          }

                          override fun onStartTrackingTouch(sb: SeekBar) {}
                          override fun onStopTrackingTouch(sb: SeekBar) {}
                      })
                  })

                  // 4. Языки
                  root.addView(title("Языки"))
                  val order = listOf("ru", "en", "uk")
                  val boxes = ArrayList<CheckBox>()
                  order.forEach { code ->
                      val cb = CheckBox(this).apply {
                          text = Layouts.names[code]
                          isChecked = code in p.langs
                      }
                      boxes.add(cb)
                      root.addView(cb)
                  }
                  boxes.forEach { cb ->
                      cb.setOnCheckedChangeListener { _, _ ->
                          val chosen = order.filterIndexed { i, _ -> boxes[i].isChecked }
                          if (chosen.isEmpty()) {
                              // хотя бы один язык должен остаться
                              cb.isChecked = true
                          } else {
                              p.langs = chosen
                          }
                      }
                  }

                  // 5. Переключатели
                  root.addView(title("Поведение"))
                  fun sw(label: String, get: () -> Boolean, set: (Boolean) -> Unit) {
                      root.addView(Switch(this).apply {
                          text = label
                          isChecked = get()
                          setPadding(0, 8.dp(), 0, 8.dp())
                          setOnCheckedChangeListener { _, v -> set(v) }
                      })
                  }
                  sw("Ряд с цифрами", { p.numberRow }, { p.numberRow = it })
                  sw("Превью символов", { p.preview }, { p.preview = it })
                  sw("Вибрация при нажатии", { p.vibrate }, { p.vibrate = it })
                  sw("Звук при нажатии", { p.sound }, { p.sound = it })
                  sw("Заглавная в начале предложения", { p.autoCap }, { p.autoCap = it })

                  // 6. Переводчик
                  root.addView(title("Переводчик"))
                  root.addView(note("Перевод работает на телефоне и бесплатный. Языки скачиваются при первом использовании, нужен интернет и сервисы Google. В клавиатуре нажми «🌐 Перевод», затем «Перевести»: текст в поле будет заменён переводом (кнопка ↩ вернёт обратно). В полях паролей перевод отключён."))
                  val codes = listOf("en", "ru", "uk", "de", "es", "fr", "it", "pt", "tr", "zh", "ja", "ko")
                  val names = listOf("English", "Русский", "Українська", "Deutsch", "Español", "Français", "Italiano", "Português", "Türkçe", "中文", "日本語", "한국어")
                  root.addView(TextView(this).apply { text = "Переводить на:" })
                  root.addView(Spinner(this).apply {
                      adapter = ArrayAdapter(this@SettingsActivity, android.R.layout.simple_spinner_dropdown_item, names)
                      setSelection(maxOf(0, codes.indexOf(p.trDst)))
                      onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                          override fun onItemSelected(parent: AdapterView<*>?, view: View?, pos: Int, id: Long) {
                              p.trDst = codes[pos]
                          }

                          override fun onNothingSelected(parent: AdapterView<*>?) {}
                      }
                  })

                  // 7. Horrons AI
                  root.addView(title("Horrons AI"))
                  root.addView(note("Помощник в клавиатуре: исправляет текст, делает короче, вежливее или отвечает на вопрос. Встроенного бесплатного ИИ нет: нужен ключ API любого ИИ-сервиса. Текст из поля отправляется выбранному сервису. В полях паролей помощник отключён. Ключ хранится только на этом телефоне."))
                  root.addView(note("Для Anthropic оставь адрес по умолчанию. Для других сервисов впиши их адрес вида https://…/v1 (формат OpenAI) и название модели. Если сервис недоступен в твоей стране, нужен VPN."))
                  fun edit(label: String, value: String, secret: Boolean, onChange: (String) -> Unit) {
                      root.addView(TextView(this).apply {
                          text = label
                          setPadding(0, 10.dp(), 0, 0)
                      })
                      root.addView(EditText(this).apply {
                          setText(value)
                          inputType = InputType.TYPE_CLASS_TEXT or
                                  (if (secret) InputType.TYPE_TEXT_VARIATION_PASSWORD else InputType.TYPE_TEXT_VARIATION_URI)
                          setSingleLine()
                          addTextChangedListener(object : TextWatcher {
                              override fun afterTextChanged(s: Editable?) {
                                  onChange(s?.toString() ?: "")
                              }

                              override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                              override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                          })
                      })
                  }
                  edit("Адрес сервера", p.aiUrl, false) { p.aiUrl = it }
                  edit("Ключ API", p.aiKey, true) { p.aiKey = it }
                  edit("Модель", p.aiModel, false) { p.aiModel = it }
                  root.addView(note("Как пользоваться: напиши текст в любом поле, нажми «✨ Horrons AI» и выбери действие. «Спросить» отправит написанное как вопрос и заменит его ответом."))
              }
          }
