                  "uz" to qw,
                  "az" to qw,
                  "ka" to listOf("ქწერტყუიოპ", "ასდფგჰჯკლ", "ზხცვბნმ"),
                  "hy" to listOf("քոեռտըւիօպխծ", "ասդֆգհջկլ", "զղցվբնմ"),
                  "bg" to listOf("чшертъуиопя", "асдфгхйкл", "зьцжбнмю"),
                  "sr" to listOf("љњертзуиопшђ", "асдфгхјклчћ", "жџцвбнм"),
                  "cs" to qz,
                  "sk" to qz,
                  "ro" to qw,
                  "hu" to qz,
                  "nl" to qw,
                  "sv" to listOf("qwertyuiopå", "asdfghjklöä", "zxcvbnm"),
                  "no" to listOf("qwertyuiopå", "asdfghjkløæ", "zxcvbnm"),
                  "da" to listOf("qwertyuiopå", "asdfghjkløæ", "zxcvbnm"),
                  "fi" to listOf("qwertyuiopå", "asdfghjklöä", "zxcvbnm"),
                  "el" to listOf("ςερτυθιοπ", "ασδφγηξκλ", "ζχψωβνμ"),
                  "he" to listOf("קראטוןםפ", "שדגכעיחלךף", "זסבהנמצתץ"),
                  "ar" to listOf("ضصثقفغعهخح", "شسيبلاتنمك", "ئءؤرىةوزظط"),
                  "hr" to qz,
                  "lt" to qw,
                  "lv" to qw,
                  "et" to listOf("qwertyuiopü", "asdfghjklöä", "zxcvbnm"),
                  "id" to qw,
                  "ms" to qw,
                  "vi" to qw
              )

              val letters: Map<String, List<String>> = baseLetters + extraLetters

              private val extraLong: Map<String, Map<String, String>> = mapOf(
                  "be" to mapOf("е" to "ё"),
                  "kk" to mapOf("а" to "ә", "н" to "ң", "г" to "ғ", "у" to "ү", "к" to "қ", "о" to "ө", "х" to "һ", "и" to "і", "ы" to "ұ"),
                  "ky" to mapOf("н" to "ң", "о" to "ө", "у" to "ү"),
                  "mn" to mapOf("о" to "ө", "у" to "ү"),
                  "uz" to mapOf("o" to "oʻ", "g" to "gʻ"),
                  "az" to mapOf("e" to "ə", "o" to "ö", "u" to "ü", "g" to "ğ", "s" to "ş", "c" to "ç", "i" to "ı"),
                  "cs" to mapOf("a" to "á", "c" to "č", "d" to "ď", "e" to "ě", "i" to "í", "n" to "ň", "o" to "ó", "r" to "ř", "s" to "š", "t" to "ť", "u" to "ú", "y" to "ý", "z" to "ž"),
                  "sk" to mapOf("a" to "á", "c" to "č", "d" to "ď", "e" to "é", "i" to "í", "l" to "ľ", "n" to "ň", "o" to "ô", "r" to "ŕ", "s" to "š", "t" to "ť", "u" to "ú", "y" to "ý", "z" to "ž"),
                  "ro" to mapOf("a" to "ă", "i" to "î", "s" to "ș", "t" to "ț"),
                  "hu" to mapOf("a" to "á", "e" to "é", "i" to "í", "o" to "ö", "u" to "ü"),
                  "nl" to mapOf("e" to "é", "i" to "ï"),
                  "hr" to mapOf("c" to "č", "s" to "š", "z" to "ž", "d" to "đ"),
                  "lt" to mapOf("a" to "ą", "c" to "č", "e" to "ė", "i" to "į", "s" to "š", "u" to "ū", "z" to "ž"),
                  "lv" to mapOf("a" to "ā", "c" to "č", "e" to "ē", "g" to "ģ", "i" to "ī", "k" to "ķ", "l" to "ļ", "n" to "ņ", "s" to "š", "u" to "ū", "z" to "ž"),
                  "et" to mapOf("o" to "õ", "s" to "š", "z" to "ž"),
                  "vi" to mapOf("a" to "â", "e" to "ê", "o" to "ô", "d" to "đ"),
                  "fi" to mapOf("s" to "š"),
                  "sv" to mapOf("e" to "é"),
                  "bg" to mapOf("и" to "ѝ")
              )

              /** Что вводится долгим нажатием: язык → (буква → вариант) */
              val longPress: Map<String, Map<String, String>> by lazy { baseLong + extraLong }

              private val baseLong: Map<String, Map<String, String>> = mapOf(
                  "ru" to mapOf("е" to "ё"),
                  "de" to mapOf("a" to "ä", "o" to "ö", "u" to "ü", "s" to "ß"),
                  "fr" to mapOf("e" to "é", "a" to "à", "u" to "ù", "c" to "ç", "i" to "î", "o" to "ô"),
                  "es" to mapOf("a" to "á", "e" to "é", "i" to "í", "o" to "ó", "u" to "ú"),
                  "it" to mapOf("e" to "è", "a" to "à", "o" to "ò", "u" to "ù", "i" to "ì"),
                  "pt" to mapOf("a" to "ã", "e" to "é", "c" to "ç", "o" to "õ", "i" to "í"),
                  "pl" to mapOf("a" to "ą", "c" to "ć", "e" to "ę", "l" to "ł", "n" to "ń", "o" to "ó", "s" to "ś", "z" to "ż")
              )

              /** Позиция буквы в верхнем ряду (0..9) для цифр долгим нажатием, или -1 */
              fun topRowIndex(lang: String, ch: String): Int {
                  val top = letters[lang]?.get(0) ?: return -1
                  val i = top.indexOf(ch)
                  return if (i in 0..9) i else -1
              }

              fun build(
                  lang: String,
                  sym: Boolean,
                  page: Int,
                  shift: Boolean,
                  numRow: Boolean,
                  enter: String,
                  globe: Boolean = true,
                  globeRight: Boolean = false,
                  comma: Boolean = true
              ): List<List<Key>> {
                  val rows = ArrayList<List<Key>>()

                  fun chars(s: String, small: Boolean = false): List<Key> =
                      s.map { Key(it.toString(), small = small) }

                  fun cased(s: String): List<Key> =
                      s.map {
                          val ch = it.toString()
                          Key(
                              if (!shift) ch
                              else if (lang == "ka") (kaShift[ch] ?: ch)
                              else if (lang == "tr" || lang == "az") ch.uppercase(java.util.Locale("tr"))
                              else ch.uppercase()
                          )
                      }

                  fun pad(keys: List<Key>): List<Key> {
                      val n = keys.size
                      if (n >= 10) return keys
                      val w = (10 - n) / 2f
                      return listOf(Key("", kind = Kind.SPACER, weight = w)) + keys + Key("", kind = Kind.SPACER, weight = w)
                  }

                  if (numRow || sym) rows.add(chars("1234567890", true))
                  val bsp = Key("⌫", "", Kind.BACKSPACE, 1.5f)

                  if (sym) {
                      if (page == 0) {
                          rows.add(chars("@#\$%&-+()/"))
                          rows.add(listOf(Key("=\\<", "", Kind.PAGE, 1.5f)) + chars("*\"':;!?") + bsp)
                      } else {
                          rows.add(chars("~`|•√π÷×¶∆"))
                          rows.add(listOf(Key("123", "", Kind.PAGE, 1.5f)) + chars("£€¥°=[]") + bsp)
                      }
                  } else {
                      val l = letters[lang] ?: letters.getValue("en")
                      rows.add(pad(cased(l[0])))
                      rows.add(pad(cased(l[1])))
                      rows.add(listOf(Key("⇧", "", Kind.SHIFT, 1.5f)) + cased(l[2]) + bsp)
                  }

                  val langName = names[lang] ?: lang
                  val cyr = lang in cyrillic
                  val symLabel = if (sym) (if (cyr) "АБВ" else "ABC") else "?123"
                  val bottom = ArrayList<Key>()
                  bottom.add(Key(symLabel, "", Kind.SYMBOLS, 1.4f))
                  if (globe && !globeRight) bottom.add(Key("🌐", "", Kind.LANG, 1f))
                  if (comma) bottom.add(Key(","))
                  bottom.add(Key(langName, " ", Kind.SPACE, if (comma) 4f else 5f))
                  if (globe && globeRight) bottom.add(Key("🌐", "", Kind.LANG, 1f))
                  bottom.add(Key("."))
                  bottom.add(Key(enter, "", Kind.ENTER, 1.4f))
                  rows.add(bottom)
                  return rows
              }
          }

          /**
           * Кнопка верхней панели.
           * kind: 0 — обычная, 1 — выделенная, 2 — текст состояния, 3 — текст ошибки
           */
          class Chip(val id: String, val label: String, val kind: Int = 0)

          /**
           * Ячейка панели (эмодзи, буфер, ИИ).
           * kind: 0 — кнопка, 1 — выделенная кнопка, 2 — просто символ (эмодзи), 3 — строка списка слева
           */
          class Cell(val id: String, val label: String, val kind: Int = 0)
