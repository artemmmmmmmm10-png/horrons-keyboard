                  "ru" to "Русский", "en" to "English", "uk" to "Українська",
                  "de" to "Deutsch", "fr" to "Français", "es" to "Español", "it" to "Italiano",
                  "pt" to "Português", "pl" to "Polski", "tr" to "Türkçe"
