          mkdir -p "$(dirname 'app/src/main/java/ru/horrons/keyboard/Ai.kt')"
          cat > 'app/src/main/java/ru/horrons/keyboard/Ai.kt' <<'HRN_EOF'
          package ru.horrons.keyboard

          import android.os.Handler
          import android.os.Looper
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          /**
           * Запрос к ИИ. Если адрес содержит anthropic.com, используется формат Anthropic Messages,
           * иначе формат OpenAI (адрес + /chat/completions), который понимают многие сервисы.
           * Сервис и модель по умолчанию определяются по ключу. При перегрузке сервера запрос повторяется.
           */
          object Ai {
              private val main = Handler(Looper.getMainLooper())

              private class Svc(val base: String, val model: String)

              /** Определяет сервис по префиксу ключа. Если адрес или модель заданы вручную, они главнее. */
              private fun resolve(url: String, key: String, model: String): Svc {
                  val d = when {
                      key.startsWith("sk-ant-") -> Svc("https://api.anthropic.com", "claude-haiku-5-5")
                      key.startsWith("sk-or-") -> Svc("https://openrouter.ai/api/v1", "openai/gpt-4o-mini")
                      key.startsWith("gsk_") -> Svc("https://api.groq.com/openai/v1", "llama-3.3-70b-versatile")
                      key.startsWith("AIza") || key.startsWith("AQ.") ->
                          Svc("https://generativelanguage.googleapis.com/v1beta/openai", "gemini-flash-latest")
                      key.startsWith("xai-") -> Svc("https://api.x.ai/v1", "grok-3-mini")
                      else -> Svc("https://api.openai.com/v1", "gpt-4o-mini")
                  }
                  val u = url.trim()
                  val m = model.trim()
                  return Svc(if (u.isEmpty() || u.equals("auto", true)) d.base else u, if (m.isEmpty()) d.model else m)
              }

              private class Reply(val code: Int, val text: String)

              private fun post(
                  base: String, anthropic: Boolean, key: String, model: String,
                  system: String, user: String
              ): Reply {
                  val url = URL(if (anthropic) "$base/v1/messages" else "$base/chat/completions")
                  val c = url.openConnection() as HttpURLConnection
                  try {
                      c.requestMethod = "POST"
                      c.connectTimeout = 15000
                      c.readTimeout = 60000
                      c.doOutput = true
                      c.setRequestProperty("Content-Type", "application/json")
                      val body = JSONObject()
                      body.put("model", model)
                      body.put("max_tokens", 1500)
                      if (anthropic) {
                          c.setRequestProperty("x-api-key", key)
                          c.setRequestProperty("anthropic-version", "2023-06-01")
                          body.put("system", system)
                          body.put("messages", JSONArray().put(JSONObject().put("role", "user").put("content", user)))
                      } else {
                          c.setRequestProperty("Authorization", "Bearer $key")
                          body.put(
                              "messages",
                              JSONArray()
                                  .put(JSONObject().put("role", "system").put("content", system))
                                  .put(JSONObject().put("role", "user").put("content", user))
                          )
                      }
                      c.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                      val code = c.responseCode
                      val stream = if (code in 200..299) c.inputStream else c.errorStream
                      val text = stream?.bufferedReader(Charsets.UTF_8)?.use { it.readText() } ?: ""
                      return Reply(code, text)
                  } finally {
                      c.disconnect()
                  }
              }

              /** Колбэк вызывается в главном потоке: (ответ, ошибка). */
              fun ask(
                  baseUrl: String,
                  key: String,
                  model: String,
                  system: String,
                  user: String,
                  cb: (String?, String?) -> Unit
              ) {
                  Thread {
                      var res: String? = null
                      var err: String? = null
                      try {
                          // ключ могут вставить с пробелами, переносами и кавычками
                          val k = key.trim().trim('"', '\'', '«', '»').replace(Regex("\\s"), "")
                          val svc = resolve(baseUrl, k, model)
                          val base = svc.base.trim().trimEnd('/')
                          val anthropic = base.contains("anthropic.com")
                          var attempt = 0
                          var reply = post(base, anthropic, k, svc.model, system, user)
                          // перегрузка сервера: пробуем ещё до двух раз
                          while (attempt < 2 && (reply.code == 429 || reply.code == 500 || reply.code == 502 ||
                                      reply.code == 503 || reply.code == 504)
                          ) {
                              attempt++
                              Thread.sleep(1500L * attempt)
                              reply = post(base, anthropic, k, svc.model, system, user)
                          }
                          if (reply.code in 200..299) {
                              val j = JSONObject(reply.text)
                              val out: String
                              if (anthropic) {
                                  val arr = j.getJSONArray("content")
                                  val sb = StringBuilder()
                                  for (i in 0 until arr.length()) {
                                      val b = arr.getJSONObject(i)
                                      if (b.optString("type") == "text") sb.append(b.optString("text"))
                                  }
                                  out = sb.toString().trim()
                              } else {
                                  out = j.getJSONArray("choices").getJSONObject(0)
                                      .getJSONObject("message").getString("content").trim()
                              }
                              if (out.isEmpty()) err = "Пустой ответ" else res = out
                          } else {
                              err = explain(reply.code, reply.text)
                          }
                      } catch (e: java.net.UnknownHostException) {
                          err = "Нет интернета или сервис заблокирован (не найден адрес). Проверьте сеть или включите VPN."
                      } catch (e: java.net.SocketTimeoutException) {
                          err = "Сервер не отвечает (таймаут). Возможно, сервис заблокирован: нужен VPN."
                      } catch (e: javax.net.ssl.SSLException) {
                          err = "Ошибка защищённого соединения. Проверьте сеть или VPN."
                      } catch (e: org.json.JSONException) {
                          err = "Сервер вернул непонятный ответ. Проверьте адрес и модель."
                      } catch (e: Exception) {
                          err = "Сбой: " + e.javaClass.simpleName + " " + (e.message ?: "").take(60)
                      }
                      val fr = res
                      val fe = err
                      main.post { cb(fr, fe) }
                  }.start()
              }

              private fun explain(code: Int, body: String): String {
                  var msg = ""
                  try {
                      msg = JSONObject(body).optJSONObject("error")?.optString("message") ?: ""
                  } catch (e: Exception) {
                  }
                  val base = when (code) {
                      400 -> "Запрос отклонён (400). Возможно, сервис не поддерживает ваш регион: включите VPN."
                      401 -> "Ключ не подошёл (401)."
                      403 -> "Доступ закрыт (403). Возможно, сервис недоступен в вашей стране: нужен VPN."
                      404 -> "Не найдено (404). Проверьте адрес сервера и название модели (можно очистить оба поля)."
                      429 -> "Слишком много запросов (429). Подождите."
                      503 -> "Сервер перегружен (503). Попробуйте позже или другую модель."
                      else -> "Ошибка сервера ($code)."
                  }
                  return if (msg.isNotEmpty()) base + " " + msg.take(80) else base
              }
          }
          HRN_EOF
          mkdir -p "$(dirname 'app/src/main/java/ru/horrons/keyboard/Dict.kt')"
          cat > 'app/src/main/java/ru/horrons/keyboard/Dict.kt' <<'HRN_EOF'
          package ru.horrons.keyboard

          import android.content.Context
          import android.content.SharedPreferences
          import android.os.Handler
          import android.os.Looper

          /**
           * Словари: небольшой встроенный список частых слов и личный словарь, который пополняется
           * тем, что вы печатаете (только на телефоне, в полях паролей не работает).
           */
          object Dict {
              private val builtinText = mapOf(
                  "ru" to "и в не на я что он с как а то все она так его но да ты к у же вы за бы по только ее мне было вот от меня еще нет о из ему теперь когда даже ну вдруг ли если уже или ни быть был него до вас нибудь опять уж вам сказал ведь там потом себя ничего ей может они тут где есть надо ней для мы тебя их чем была сам чтоб без будто чего раз тоже себе под будет ж тогда кто этот того потому этого какой совсем ним здесь этом один почти мой тем чтобы нее сейчас были куда зачем всех никогда можно при наконец два об другой хоть после над больше тот через эти нас про всего них какая много разве три эту моя впрочем хорошо свою этой перед иногда лучше чуть том нельзя такой им более всегда конечно всю между привет пока здравствуйте спасибо пожалуйста извините добрый день вечер утро ночи дела делаешь можешь могу хочу буду давай сегодня завтра вчера сейчас работа дом друг время человек жизнь рука слово город голова деньги вопрос ответ телефон сообщение письмо картинка сделать сказать говорить знать хотеть идти видеть смотреть думать понять любить жить работать позвони напиши отправь приходи встретимся скоро быстро медленно большой маленький новый старый красивый правда конечно наверное возможно отлично замечательно давайте поговорим",
                  "en" to "the be to of and a in that have i it for not on with he as you do at this but his by from they we say her she or an will my one all would there their what so up out if about who get which go me when make can like time no just him know take people into year your good some could them see other than then now look only come its over think also back after use two how our work first well way even new want because any these give day most us is are was were been has had did am hello hi hey thanks thank please sorry yes okay ok sure great nice love home friend phone message today tomorrow yesterday tonight morning evening night really very much more where here need should call text send meet soon later never always maybe probably actually already still again going doing coming having being something nothing everything anything someone everyone"
              )

              private val pairs = mapOf(
                  "ru" to listOf("как дела", "как ты", "что делаешь", "до свидания", "добрый день", "доброе утро", "добрый вечер", "спасибо большое", "хорошего дня", "я тебя", "не знаю", "я думаю", "я хочу", "давай встретимся", "очень рад"),
                  "en" to listOf("how are", "are you", "thank you", "see you", "good morning", "good night", "i am", "i will", "i think", "i want", "let me", "talk to", "looking forward", "have a", "see you soon")
              )

              private val builtin = HashMap<String, List<String>>()
              private val builtinRank = HashMap<String, HashMap<String, Int>>()
              private val user = HashMap<String, HashMap<String, Int>>()
              private val next = HashMap<String, HashMap<String, Int>>()
              private var sp: SharedPreferences? = null
              private var loaded = false
              private val h = Handler(Looper.getMainLooper())
              private val saveRun = Runnable { save() }

              private const val MAX_WORDS = 6000
              private const val MAX_PAIRS = 4000

              /** Слово из личного словаря считается известным, когда встретилось не меньше стольких раз */
              private const val MIN_USER = 2

              fun init(ctx: Context) {
                  if (loaded) return
                  loaded = true
                  sp = ctx.applicationContext.getSharedPreferences("dict", Context.MODE_PRIVATE)
                  for ((lang, text) in builtinText) {
                      val list = text.split(" ").filter { it.isNotEmpty() }.distinct()
                      builtin[lang] = list
                      val m = HashMap<String, Int>()
                      list.forEachIndexed { i, w -> m[w] = i }
                      builtinRank[lang] = m
                  }
                  val s = sp ?: return
                  for (lang in Layouts.all) {
                      readMap(s.getString("u_$lang", "") ?: "", user.getOrPut(lang) { HashMap() })
                      readMap(s.getString("n_$lang", "") ?: "", next.getOrPut(lang) { HashMap() })
                  }
              }

              private fun readMap(text: String, into: HashMap<String, Int>) {
                  for (line in text.split("\n")) {
                      val t = line.lastIndexOf('\t')
                      if (t <= 0) continue
                      val n = line.substring(t + 1).toIntOrNull() ?: continue
                      into[line.substring(0, t)] = n
                  }
              }

              private fun writeMap(m: Map<String, Int>): String {
                  val sb = StringBuilder()
                  for ((k, v) in m) sb.append(k).append('\t').append(v).append('\n')
                  return sb.toString()
              }

              private fun save() {
                  val e = sp?.edit() ?: return
                  for ((lang, m) in user) e.putString("u_$lang", writeMap(m))
                  for ((lang, m) in next) e.putString("n_$lang", writeMap(m))
                  e.apply()
              }

              private fun scheduleSave() {
                  h.removeCallbacks(saveRun)
                  h.postDelayed(saveRun, 4000)
              }

              private fun userMap(lang: String): HashMap<String, Int> = user.getOrPut(lang) { HashMap() }
              private fun nextMap(lang: String): HashMap<String, Int> = next.getOrPut(lang) { HashMap() }

              fun isWord(w: String): Boolean = w.length in 2..24 && w.all { it.isLetter() || it == '\'' || it == '-' }

              private fun score(lang: String, w: String): Int {
                  var s = 0
                  val u = user[lang]?.get(w)
                  if (u != null && u >= MIN_USER) s += u * 100 + 50
                  val r = builtinRank[lang]?.get(w)
                  if (r != null) s += maxOf(1, 400 - r)
                  return s
              }

              fun known(lang: String, w: String): Boolean {
                  val l = w.lowercase()
                  return (user[lang]?.get(l) ?: 0) >= MIN_USER || builtinRank[lang]?.containsKey(l) == true
              }

              private fun withCase(w: String, like: String): String =
                  if (like.isNotEmpty() && like.length > 1 && like.all { it.isUpperCase() }) w.uppercase()
                  else if (like.isNotEmpty() && like[0].isUpperCase()) w.replaceFirstChar { it.uppercase() }
                  else w

              /** Варианты продолжения слова по начатым буквам. */
              fun suggest(lang: String, prefix: String, limit: Int): List<String> {
                  val p = prefix.lowercase()
                  if (p.isEmpty()) return emptyList()
                  val cand = HashSet<String>()
                  user[lang]?.forEach { (k, v) -> if (v >= MIN_USER && k.length > p.length && k.startsWith(p)) cand.add(k) }
                  builtin[lang]?.forEach { if (it.length > p.length && it.startsWith(p)) cand.add(it) }
                  return cand.sortedByDescending { score(lang, it) }.take(limit).map { withCase(it, prefix) }
              }

              /** Предсказание следующего слова после предыдущего слова. */
              fun nextWords(lang: String, prev: String, limit: Int): List<String> {
                  val p = prev.lowercase()
                  if (p.isEmpty()) return emptyList()
                  val found = HashMap<String, Int>()
                  val prefix = "$p "
                  nextMap(lang).forEach { (k, v) ->
                      if (v >= MIN_USER && k.startsWith(prefix)) found[k.substring(prefix.length)] = v * 10
                  }
                  pairs[lang]?.forEach {
                      if (it.startsWith(prefix)) {
                          val w = it.substring(prefix.length)
                          found[w] = (found[w] ?: 0) + 1
                      }
                  }
                  return found.entries.sortedByDescending { it.value }.take(limit).map { it.key }
              }

              fun learn(lang: String, word: String) {
                  val w = word.lowercase()
                  if (!isWord(w)) return
                  val m = userMap(lang)
                  if (m.size >= MAX_WORDS && !m.containsKey(w)) return
                  m[w] = (m[w] ?: 0) + 1
                  scheduleSave()
              }

              fun learnPair(lang: String, prev: String, word: String) {
                  val a = prev.lowercase()
                  val b = word.lowercase()
                  if (!isWord(a) || !isWord(b)) return
                  val m = nextMap(lang)
                  val key = "$a $b"
                  if (m.size >= MAX_PAIRS && !m.containsKey(key)) return
                  m[key] = (m[key] ?: 0) + 1
                  scheduleSave()
              }

              /** Расстояние Дамерау: вставка, удаление, замена, перестановка соседних букв. */
              private fun dist(a: String, b: String): Int {
                  val n = a.length
                  val m = b.length
                  val d = Array(n + 1) { IntArray(m + 1) }
                  for (i in 0..n) d[i][0] = i
                  for (j in 0..m) d[0][j] = j
                  for (i in 1..n) {
                      for (j in 1..m) {
                          val cost = if (a[i - 1] == b[j - 1]) 0 else 1
                          var v = minOf(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost)
                          if (i > 1 && j > 1 && a[i - 1] == b[j - 2] && a[i - 2] == b[j - 1]) v = minOf(v, d[i - 2][j - 2] + 1)
                          d[i][j] = v
                      }
                  }
                  return d[n][m]
              }

              /** Исправление опечатки: слово из словаря на расстоянии 1, или null, если слово знакомое. */
              fun correct(lang: String, word: String): String? {
                  val w = word.lowercase()
                  if (w.length < 4 || !isWord(w) || known(lang, w)) return null
                  var best: String? = null
                  var bs = -1
                  val all = HashSet<String>()
                  user[lang]?.forEach { (k, v) -> if (v >= MIN_USER) all.add(k) }
                  builtin[lang]?.let { all.addAll(it) }
                  for (c in all) {
                      if (Math.abs(c.length - w.length) > 1 || c[0] != w[0]) continue
                      if (dist(w, c) == 1) {
                          val s = score(lang, c)
                          if (s > bs) {
                              bs = s
                              best = c
                          }
                      }
                  }
                  return best?.let { withCase(it, word) }
              }

              // ----- управление личным словарём из настроек -----

              fun userCount(): Int {
                  var n = 0
                  for (m in user.values) n += m.size
                  return n
              }

              fun add(lang: String, word: String): Boolean {
                  val w = word.trim().lowercase()
                  if (!isWord(w)) return false
                  val m = userMap(lang)
                  m[w] = (m[w] ?: 0) + 3
                  save()
                  return true
              }

              fun clearUser() {
                  user.values.forEach { it.clear() }
                  next.values.forEach { it.clear() }
                  save()
              }
          }
          HRN_EOF
