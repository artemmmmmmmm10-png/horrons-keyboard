                  "id" to "Indonesia", "ms" to "Melayu", "vi" to "Tiếng Việt", "ky" to "Кыргызча", "mn" to "Монгол"
              )

              val names: Map<String, String> = baseNames + extraNames

              /** Все доступные раскладки */
              val all: List<String> = listOf("ru", "en", "uk", "de", "fr", "es", "it", "pt", "pl", "tr") +
                      listOf(
                          "be", "kk", "uz", "az", "ka", "hy", "bg", "sr", "cs", "sk", "ro", "hu", "nl", "sv", "no", "da",
                          "fi", "el", "he", "ar", "hr", "lt", "lv", "et", "id", "ms", "vi", "ky", "mn"
                      )

              /** Языки на кириллице: на клавише переключения символов пишется АБВ */
              val cyrillic = setOf("ru", "uk", "be", "kk", "bg", "sr", "ky", "mn")

              /** Для грузинского Shift даёт другие буквы, а не заглавные */
              private val kaShift = mapOf("წ" to "ჭ", "რ" to "ღ", "ტ" to "თ", "ს" to "შ", "ჯ" to "ჟ", "ზ" to "ძ", "ც" to "ჩ")

              private val baseLetters = mapOf(
                  "ru" to listOf("йцукенгшщзхъ", "фывапролджэ", "ячсмитьбю"),
                  "en" to listOf("qwertyuiop", "asdfghjkl", "zxcvbnm"),
                  "uk" to listOf("йцукенгшщзхї", "фівапролджє", "ячсмитьбюґ"),
                  "de" to listOf("qwertzuiop", "asdfghjkl", "yxcvbnm"),
                  "fr" to listOf("azertyuiop", "qsdfghjklm", "wxcvbn"),
                  "es" to listOf("qwertyuiop", "asdfghjklñ", "zxcvbnm"),
                  "it" to listOf("qwertyuiop", "asdfghjkl", "zxcvbnm"),
                  "pt" to listOf("qwertyuiop", "asdfghjkl", "zxcvbnm"),
                  "pl" to listOf("qwertyuiop", "asdfghjkl", "zxcvbnm"),
                  "tr" to listOf("ertyuıopğü", "asdfghjklşi", "zcvbnmöç")
              )

              private val qw = listOf("qwertyuiop", "asdfghjkl", "zxcvbnm")
              private val qz = listOf("qwertzuiop", "asdfghjkl", "yxcvbnm")
              private val cy = listOf("йцукенгшщзхъ", "фывапролджэ", "ячсмитьбю")

              private val extraLetters = mapOf(
                  "be" to listOf("йцукенгшўзх", "фывапролджэ", "ячсмітьбю"),
