name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Создать проект Horrons Клавиатура
        run: |
          set -e
          mkdir -p HorronsKeyboard
          cd HorronsKeyboard
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'HRN_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "ru.horrons.keyboard"
              compileSdk = 34

              defaultConfig {
                  applicationId = "ru.horrons.keyboard"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          HRN_EOF
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'HRN_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".SettingsActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".KeyboardService"
                      android:exported="true"
                      android:label="@string/ime_name"
                      android:permission="android.permission.BIND_INPUT_METHOD">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          HRN_EOF
          mkdir -p "$(dirname 'app/src/main/java/ru/horrons/keyboard/KeyboardService.kt')"
          cat > 'app/src/main/java/ru/horrons/keyboard/KeyboardService.kt' <<'HRN_EOF'
          package ru.horrons.keyboard

          import android.inputmethodservice.InputMethodService
          import android.os.SystemClock
          import android.text.InputType
          import android.view.KeyEvent
          import android.view.View
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager

          class KeyboardService : InputMethodService() {

              lateinit var prefs: Prefs
              private var kv: KeyboardView? = null

              var lang: String = "ru"
              var symbols: Boolean = false
              var page: Int = 0

              /** 0 — выкл, 1 — одна заглавная, 2 — Caps Lock */
              var shift: Int = 0
              private var lastShiftTap = 0L

              private var enterLabel = "↵"
              private var password = false

              override fun onCreate() {
                  super.onCreate()
                  prefs = Prefs(this)
              }

              override fun onEvaluateFullscreenMode(): Boolean = false

              override fun onCreateInputView(): View {
                  val v = KeyboardView(this, this)
                  kv = v
                  return v
              }

              override fun onStartInputView(info: EditorInfo, restarting: Boolean) {
                  super.onStartInputView(info, restarting)
                  val cls = info.inputType and InputType.TYPE_MASK_CLASS
                  val variation = info.inputType and InputType.TYPE_MASK_VARIATION
                  val numeric = cls == InputType.TYPE_CLASS_NUMBER || cls == InputType.TYPE_CLASS_PHONE
                  password = (cls == InputType.TYPE_CLASS_TEXT && (
                          variation == InputType.TYPE_TEXT_VARIATION_PASSWORD ||
                                  variation == InputType.TYPE_TEXT_VARIATION_VISIBLE_PASSWORD ||
                                  variation == InputType.TYPE_TEXT_VARIATION_WEB_PASSWORD)) ||
                          (cls == InputType.TYPE_CLASS_NUMBER && variation == InputType.TYPE_NUMBER_VARIATION_PASSWORD)

                  val langs = prefs.langs.ifEmpty { listOf("ru") }
                  if (lang !in langs) lang = langs[0]
                  if (password && "en" in langs) lang = "en"

                  symbols = numeric
                  page = 0
                  shift = 0

                  enterLabel = when (info.imeOptions and EditorInfo.IME_MASK_ACTION) {
                      EditorInfo.IME_ACTION_SEARCH -> "🔍"
                      EditorInfo.IME_ACTION_SEND -> "➤"
                      EditorInfo.IME_ACTION_GO, EditorInfo.IME_ACTION_NEXT, EditorInfo.IME_ACTION_PREVIOUS -> "→"
                      EditorInfo.IME_ACTION_DONE -> "✓"
                      else -> "↵"
                  }
                  updateShift()
                  kv?.refresh()
              }

              override fun onUpdateSelection(
                  oldSelStart: Int, oldSelEnd: Int,
                  newSelStart: Int, newSelEnd: Int,
                  candidatesStart: Int, candidatesEnd: Int
              ) {
                  super.onUpdateSelection(oldSelStart, oldSelEnd, newSelStart, newSelEnd, candidatesStart, candidatesEnd)
                  val before = shift
                  updateShift()
                  if (before != shift) kv?.refresh()
              }

              /** Строки раскладки для текущего состояния. */
              fun rows(): List<List<Key>> =
                  Layouts.build(lang, symbols, page, shift > 0, prefs.numberRow, enterLabel)

              /** Автозаглавная буква в начале предложения. */
              private fun updateShift() {
                  if (shift == 2) return
                  if (!prefs.autoCap || password || symbols) {
                      shift = 0
                      return
                  }
                  val ic = currentInputConnection
                  val ei = currentInputEditorInfo
                  shift = if (ic != null && ei != null && ei.inputType != 0 &&
                      ic.getCursorCapsMode(ei.inputType) != 0
                  ) 1 else 0
              }

              fun type(text: String) {
                  currentInputConnection?.commitText(text, 1)
                  val before = shift
                  if (shift == 1) shift = 0
                  updateShift()
                  if (before != shift) kv?.refresh()
              }

              fun backspace() {
                  val ic = currentInputConnection ?: return
                  val sel = ic.getSelectedText(0)
                  if (sel != null && sel.isNotEmpty()) {
                      ic.commitText("", 1)
                  } else {
                      sendDownUpKeyEvents(KeyEvent.KEYCODE_DEL)
                  }
                  val before = shift
                  updateShift()
                  if (before != shift) kv?.refresh()
              }

              fun enter() {
                  val ei = currentInputEditorInfo
                  val ic = currentInputConnection ?: return
                  if (ei == null) {
                      sendDownUpKeyEvents(KeyEvent.KEYCODE_ENTER)
                      return
                  }
                  val action = ei.imeOptions and EditorInfo.IME_MASK_ACTION
                  val multiLine = (ei.inputType and InputType.TYPE_TEXT_FLAG_MULTI_LINE) != 0
                  val noAction = (ei.imeOptions and EditorInfo.IME_FLAG_NO_ENTER_ACTION) != 0
                  if (!multiLine && !noAction &&
                      action != EditorInfo.IME_ACTION_NONE && action != EditorInfo.IME_ACTION_UNSPECIFIED
                  ) {
                      ic.performEditorAction(action)
                  } else {
                      sendDownUpKeyEvents(KeyEvent.KEYCODE_ENTER)
                  }
              }

              fun onShift() {
                  val now = SystemClock.uptimeMillis()
                  shift = when {
                      shift == 1 && now - lastShiftTap < 350 -> 2
                      shift != 0 -> 0
                      else -> 1
                  }
                  lastShiftTap = now
                  kv?.refresh()
              }

              fun toggleSymbols() {
                  symbols = !symbols
                  page = 0
                  if (symbols) shift = 0 else updateShift()
                  kv?.refresh()
              }

              fun togglePage() {
                  page = 1 - page
                  kv?.refresh()
              }

              fun nextLang() {
                  val langs = prefs.langs.ifEmpty { listOf("ru") }
                  if (langs.size <= 1) {
                      showPicker()
                      return
                  }
                  val i = langs.indexOf(lang)
                  lang = langs[(i + 1) % langs.size]
                  symbols = false
                  page = 0
                  updateShift()
                  kv?.refresh()
              }

              fun showPicker() {
                  val imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                  imm.showInputMethodPicker()
              }
          }
          HRN_EOF
          mkdir -p "$(dirname 'app/src/main/java/ru/horrons/keyboard/KeyboardView.kt')"
          cat > 'app/src/main/java/ru/horrons/keyboard/KeyboardView.kt' <<'HRN_EOF'
          package ru.horrons.keyboard

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.os.Handler
          import android.os.Looper
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.SoundEffectConstants
          import android.view.View

          /** Клавиатура, нарисованная на Canvas: превью букв, долгое нажатие, повтор стирания, темы. */
          class KeyboardView(ctx: Context, private val svc: KeyboardService) : View(ctx) {

              private class Slot(val key: Key, val r: RectF)

              private var slots: List<Slot> = emptyList()
              private var rowsCount = 4

              private val uiHandler = Handler(Looper.getMainLooper())
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val stroke = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
                  strokeJoin = Paint.Join.ROUND
              }
              private val txt = Paint(Paint.ANTI_ALIAS_FLAG).apply { textAlign = Paint.Align.CENTER }

              private var pressed: Slot? = null
              private var pid = -1
              private var longFired = false
              private var topTap = false
              private var lastX = 0f

              private val density = resources.displayMetrics.density
              private fun dp(v: Float): Float = v * density

              private val topH: Float get() = dp(34f)
              private val gap: Float get() = dp(4f)
              private fun keyH(): Float = dp(42f) * svc.prefs.height / 100f

              fun refresh() {
                  requestLayout()
                  invalidate()
              }

              // ---------- размеры ----------

              private fun layoutSlots(w: Float) {
                  val rows = svc.rows()
                  rowsCount = rows.size
                  val out = ArrayList<Slot>()
                  val padX = dp(3f)
                  val kh = keyH()
                  var y = topH + dp(4f)
                  for (row in rows) {
                      var total = 0f
                      for (k in row) total += k.weight
                      val avail = w - 2 * padX - gap * (row.size - 1)
                      var x = padX
                      for (k in row) {
                          val kw = avail * k.weight / total
                          if (k.kind != Kind.SPACER) out.add(Slot(k, RectF(x, y, x + kw, y + kh)))
                          x += kw + gap
                      }
                      y += kh + gap
                  }
                  slots = out
              }

              private fun totalH(): Float = topH + dp(4f) + rowsCount * (keyH() + gap) + dp(6f)

              override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
                  val w = MeasureSpec.getSize(widthMeasureSpec)
                  layoutSlots(w.toFloat())
                  setMeasuredDimension(w, totalH().toInt())
              }

              // ---------- отрисовка ----------

              override fun onDraw(c: Canvas) {
                  val t = Themes.get(svc.prefs.theme)
                  c.drawColor(t.bg)

                  // верхняя панель: язык слева, «скрыть» справа
                  txt.color = t.hint
                  txt.textSize = dp(13f)
                  txt.textAlign = Paint.Align.LEFT
                  c.drawText(Layouts.names[svc.lang] ?: svc.lang, dp(12f), topH / 2 + dp(5f), txt)
                  txt.textAlign = Paint.Align.RIGHT
                  txt.textSize = dp(18f)
                  c.drawText("⌄", width - dp(16f), topH / 2 + dp(6f), txt)
                  txt.textAlign = Paint.Align.CENTER

                  val rad = dp(7f)
                  val kh = keyH()
                  for (s in slots) {
                      val k = s.key
                      paint.color = when {
                          s === pressed -> t.pressed
                          k.kind == Kind.ENTER -> t.accent
                          k.kind == Kind.SHIFT && svc.shift > 0 -> t.text
                          k.kind == Kind.CHAR || k.kind == Kind.SPACE -> t.key
                          else -> t.special
                      }
                      c.drawRoundRect(s.r, rad, rad, paint)
                      drawLabel(c, s, t, kh)
                  }

                  // превью нажатой буквы
                  val ps = pressed
                  if (ps != null && svc.prefs.preview && ps.key.kind == Kind.CHAR && !longFired) {
                      val bw = ps.r.width() * 1.3f
                      val bottom = ps.r.top - dp(2f)
                      val bh = minOf(dp(54f), bottom)
                      if (bh > dp(20f)) {
                          val left = (ps.r.centerX() - bw / 2).coerceIn(dp(2f), maxOf(dp(2f), width - bw - dp(2f)))
                          val r = RectF(left, bottom - bh, left + bw, bottom)
                          paint.color = t.preview
                          c.drawRoundRect(r, dp(10f), dp(10f), paint)
                          txt.color = t.text
                          txt.textSize = bh * 0.6f
                          c.drawText(ps.key.out, r.centerX(), r.centerY() - (txt.ascent() + txt.descent()) / 2, txt)
                      }
                  }
              }

              private fun drawLabel(c: Canvas, s: Slot, t: KbTheme, kh: Float) {
                  val k = s.key
                  val cx = s.r.centerX()
                  val cy = s.r.centerY()
                  when (k.kind) {
                      Kind.BACKSPACE -> drawBackspace(c, cx, cy, t.text)
                      Kind.SHIFT -> {
                          val on = svc.shift > 0
                          drawShift(c, cx, cy, if (on) t.bg else t.text, svc.shift == 2, svc.shift == 2)
                      }
                      else -> {
                          txt.color = when (k.kind) {
                              Kind.ENTER -> t.accentText
                              Kind.SPACE -> t.hint
                              else -> t.text
                          }
                          txt.textSize = when {
                              k.kind == Kind.SPACE -> kh * 0.32f
                              k.small -> kh * 0.38f
                              k.kind == Kind.SYMBOLS || k.kind == Kind.PAGE -> kh * 0.34f
                              else -> kh * 0.46f
                          }
                          c.drawText(k.label, cx, cy - (txt.ascent() + txt.descent()) / 2, txt)

                          // подсказка о долгом нажатии в углу клавиши
                          if (k.kind == Kind.CHAR && !k.small) {
                              val a = alt(k)
                              if (a != null) {
                                  txt.color = t.hint
                                  txt.textSize = kh * 0.24f
                                  c.drawText(a, s.r.right - dp(7f), s.r.top + kh * 0.3f, txt)
                              }
                          }
                      }
                  }
              }

              private fun drawBackspace(c: Canvas, cx: Float, cy: Float, color: Int) {
                  val s = dp(9f)
                  stroke.color = color
                  stroke.strokeWidth = dp(1.8f)
                  val p = Path()
                  p.moveTo(cx - s * 1.1f, cy)
                  p.lineTo(cx - s * 0.35f, cy - s * 0.75f)
                  p.lineTo(cx + s * 1.1f, cy - s * 0.75f)
                  p.lineTo(cx + s * 1.1f, cy + s * 0.75f)
                  p.lineTo(cx - s * 0.35f, cy + s * 0.75f)
                  p.close()
                  c.drawPath(p, stroke)
                  c.drawLine(cx - s * 0.05f, cy - s * 0.3f, cx + s * 0.65f, cy + s * 0.3f, stroke)
                  c.drawLine(cx + s * 0.65f, cy - s * 0.3f, cx - s * 0.05f, cy + s * 0.3f, stroke)
              }

              private fun drawShift(c: Canvas, cx: Float, cy: Float, color: Int, filled: Boolean, lock: Boolean) {
                  val s = dp(9f)
                  val p = Path()
                  p.moveTo(cx, cy - s)
                  p.lineTo(cx + s, cy + s * 0.05f)
                  p.lineTo(cx + s * 0.45f, cy + s * 0.05f)
                  p.lineTo(cx + s * 0.45f, cy + s * 0.75f)
                  p.lineTo(cx - s * 0.45f, cy + s * 0.75f)
                  p.lineTo(cx - s * 0.45f, cy + s * 0.05f)
                  p.lineTo(cx - s, cy + s * 0.05f)
                  p.close()
                  paint.color = color
                  stroke.color = color
                  stroke.strokeWidth = dp(1.8f)
                  if (filled) c.drawPath(p, paint) else c.drawPath(p, stroke)
                  if (lock) c.drawLine(cx - s * 0.45f, cy + s * 1.05f, cx + s * 0.45f, cy + s * 1.05f, stroke)
              }

              // ---------- долгое нажатие ----------

              /** Что вводится долгим нажатием на клавишу (или null). */
              private fun alt(k: Key): String? {
                  if (k.kind != Kind.CHAR || k.small) return null
                  val base = k.out.lowercase()
                  if (svc.lang == "ru") {
                      val sp = Layouts.longPress[base]
                      if (sp != null) return if (k.out != base) sp.uppercase() else sp
                  }
                  if (!svc.prefs.numberRow && !svc.symbols) {
                      val i = Layouts.topRowIndex(svc.lang, base)
                      if (i >= 0) return "1234567890"[i].toString()
                  }
                  return null
              }

              private val longRun = Runnable {
                  val s = pressed
                  if (s != null) {
                      val k = s.key
                      if (k.kind == Kind.LANG) {
                          longFired = true
                          svc.showPicker()
                          pressed = null
                          invalidate()
                      } else {
                          val a = alt(k)
                          if (a != null) {
                              longFired = true
                              feedback()
                              svc.type(a)
                              invalidate()
                          }
                      }
                  }
              }

              private val repeatRun = object : Runnable {
                  override fun run() {
                      if (pressed?.key?.kind == Kind.BACKSPACE) {
                          svc.backspace()
                          uiHandler.postDelayed(this, 50)
                      }
                  }
              }

              // ---------- касания ----------

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_POINTER_DOWN -> {
                          if (pressed != null) release(true)
                          val i = e.actionIndex
                          pid = e.getPointerId(i)
                          press(e.getX(i), e.getY(i))
                      }
                      MotionEvent.ACTION_MOVE -> {
                          val i = e.findPointerIndex(pid)
                          if (i >= 0) slide(e.getX(i), e.getY(i))
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_POINTER_UP -> {
                          val i = e.actionIndex
                          if (e.getPointerId(i) == pid) {
                              lastX = e.getX(i)
                              release(true)
                              pid = -1
                          }
                      }
                      MotionEvent.ACTION_CANCEL -> {
                          release(false)
                          pid = -1
                      }
                  }
                  return true
              }

              private fun find(x: Float, y: Float): Slot? {
                  var best: Slot? = null
                  var bd = Float.MAX_VALUE
                  for (s in slots) {
                      val dx = maxOf(s.r.left - x, 0f, x - s.r.right)
                      val dy = maxOf(s.r.top - y, 0f, y - s.r.bottom)
                      val dd = dx * dx + dy * dy
                      if (dd < bd) {
                          bd = dd
                          best = s
                      }
                  }
                  val tol = dp(10f)
                  return if (bd <= tol * tol) best else null
              }

              private fun press(x: Float, y: Float) {
                  longFired = false
                  lastX = x
                  if (y < topH) {
                      topTap = true
                      return
                  }
                  val s = find(x, y) ?: return
                  pressed = s
                  feedback()
                  val k = s.key
                  if (k.kind == Kind.BACKSPACE) {
                      svc.backspace()
                      uiHandler.postDelayed(repeatRun, 400)
                  } else if (alt(k) != null || k.kind == Kind.LANG) {
                      uiHandler.postDelayed(longRun, 380)
                  }
                  invalidate()
              }

              private fun slide(x: Float, y: Float) {
                  lastX = x
                  val cur = pressed ?: return
                  if (cur.key.kind == Kind.BACKSPACE) return
                  val s = find(x, y) ?: return
                  if (s !== cur) {
                      uiHandler.removeCallbacks(longRun)
                      longFired = false
                      pressed = s
                      if (alt(s.key) != null) uiHandler.postDelayed(longRun, 380)
                      invalidate()
                  }
              }

              private fun release(commit: Boolean) {
                  uiHandler.removeCallbacks(longRun)
                  uiHandler.removeCallbacks(repeatRun)
                  val s = pressed
                  pressed = null
                  if (topTap) {
                      topTap = false
                      if (commit && lastX > width - dp(64f)) svc.requestHideSelf(0)
                      invalidate()
                      return
                  }
                  if (commit && s != null && !longFired && s.key.kind != Kind.BACKSPACE) act(s.key)
                  longFired = false
                  invalidate()
              }

              private fun act(k: Key) {
                  when (k.kind) {
                      Kind.CHAR -> svc.type(k.out)
                      Kind.SPACE -> svc.type(" ")
                      Kind.SHIFT -> svc.onShift()
                      Kind.SYMBOLS -> svc.toggleSymbols()
                      Kind.PAGE -> svc.togglePage()
                      Kind.LANG -> svc.nextLang()
                      Kind.ENTER -> svc.enter()
                      else -> {}
                  }
              }

              @Suppress("DEPRECATION")
              private fun feedback() {
                  if (svc.prefs.vibrate) {
                      performHapticFeedback(
                          HapticFeedbackConstants.KEYBOARD_TAP,
                          HapticFeedbackConstants.FLAG_IGNORE_GLOBAL_SETTING
                      )
                  }
                  if (svc.prefs.sound) playSoundEffect(SoundEffectConstants.CLICK)
              }
          }
          HRN_EOF
          mkdir -p "$(dirname 'app/src/main/java/ru/horrons/keyboard/Layouts.kt')"
          cat > 'app/src/main/java/ru/horrons/keyboard/Layouts.kt' <<'HRN_EOF'
          package ru.horrons.keyboard

          enum class Kind { CHAR, SHIFT, BACKSPACE, SYMBOLS, PAGE, LANG, SPACE, ENTER, SPACER }

          /**
           * @param label что нарисовано на клавише
           * @param out   что вводится (для обычных символов)
           * @param weight относительная ширина клавиши в ряду
           * @param small мелкий шрифт (цифры)
           */
          class Key(
              val label: String,
              val out: String = label,
              val kind: Kind = Kind.CHAR,
              val weight: Float = 1f,
              val small: Boolean = false
          )

          object Layouts {
              val names = mapOf("ru" to "Русский", "en" to "English", "uk" to "Українська")

              val letters = mapOf(
                  "ru" to listOf("йцукенгшщзхъ", "фывапролджэ", "ячсмитьбю"),
                  "en" to listOf("qwertyuiop", "asdfghjkl", "zxcvbnm"),
                  "uk" to listOf("йцукенгшщзхї", "фівапролджє", "ячсмитьбюґ")
              )

              /** Что вводится долгим нажатием (только для русской раскладки) */
              val longPress = mapOf("е" to "ё")

              /** Позиция буквы в верхнем ряду (0..9) для цифр долгим нажатием, или -1 */
              fun topRowIndex(lang: String, ch: String): Int {
                  val top = letters[lang]?.get(0) ?: return -1
                  val i = top.indexOf(ch)
                  return if (i in 0..9) i else -1
              }

              fun build(
                  lang: String,
                  sym: Boolean,
                  page: Int,
                  shift: Boolean,
                  numRow: Boolean,
                  enter: String
              ): List<List<Key>> {
                  val rows = ArrayList<List<Key>>()

                  fun chars(s: String, small: Boolean = false): List<Key> =
                      s.map { Key(it.toString(), small = small) }

                  fun cased(s: String): List<Key> =
                      s.map { Key(if (shift) it.toString().uppercase() else it.toString()) }

                  fun pad(keys: List<Key>): List<Key> {
                      val n = keys.size
                      if (n >= 10) return keys
                      val w = (10 - n) / 2f
                      return listOf(Key("", kind = Kind.SPACER, weight = w)) + keys + Key("", kind = Kind.SPACER, weight = w)
                  }

                  if (numRow || sym) rows.add(chars("1234567890", true))
                  val bsp = Key("⌫", "", Kind.BACKSPACE, 1.5f)

                  if (sym) {
                      if (page == 0) {
                          rows.add(chars("@#\$%&-+()/"))
                          rows.add(listOf(Key("=\\<", "", Kind.PAGE, 1.5f)) + chars("*\"':;!?") + bsp)
                      } else {
                          rows.add(chars("~`|•√π÷×¶∆"))
                          rows.add(listOf(Key("123", "", Kind.PAGE, 1.5f)) + chars("£€¥°=[]") + bsp)
                      }
                  } else {
                      val l = letters[lang] ?: letters.getValue("en")
                      rows.add(pad(cased(l[0])))
                      rows.add(pad(cased(l[1])))
                      rows.add(listOf(Key("⇧", "", Kind.SHIFT, 1.5f)) + cased(l[2]) + bsp)
                  }

                  val langName = names[lang] ?: lang
                  val symLabel = if (sym) (if (lang == "en") "ABC" else "АБВ") else "?123"
                  rows.add(
                      listOf(
                          Key(symLabel, "", Kind.SYMBOLS, 1.4f),
                          Key(","),
                          Key("🌐", "", Kind.LANG, 1f),
                          Key(langName, " ", Kind.SPACE, 4f),
                          Key("."),
                          Key(enter, "", Kind.ENTER, 1.4f)
                      )
                  )
                  return rows
              }
          }
          HRN_EOF
          mkdir -p "$(dirname 'app/src/main/java/ru/horrons/keyboard/Prefs.kt')"
          cat > 'app/src/main/java/ru/horrons/keyboard/Prefs.kt' <<'HRN_EOF'
          package ru.horrons.keyboard

          import android.content.Context
          import android.content.SharedPreferences

          /** Настройки клавиатуры. Хранятся в SharedPreferences и общие для сервиса и экрана настроек. */
          class Prefs(ctx: Context) {
              private val sp: SharedPreferences = ctx.getSharedPreferences("kb", Context.MODE_PRIVATE)

              var theme: Int
                  get() = sp.getInt("theme", 0)
                  set(v) { sp.edit().putInt("theme", v).apply() }

              /** Высота клавиш в процентах: 70..130 */
              var height: Int
                  get() = sp.getInt("height", 100)
                  set(v) { sp.edit().putInt("height", v).apply() }

              var vibrate: Boolean
                  get() = sp.getBoolean("vibrate", true)
                  set(v) { sp.edit().putBoolean("vibrate", v).apply() }

              var sound: Boolean
                  get() = sp.getBoolean("sound", false)
                  set(v) { sp.edit().putBoolean("sound", v).apply() }

              var preview: Boolean
                  get() = sp.getBoolean("preview", true)
                  set(v) { sp.edit().putBoolean("preview", v).apply() }

              var numberRow: Boolean
                  get() = sp.getBoolean("numberRow", true)
                  set(v) { sp.edit().putBoolean("numberRow", v).apply() }

              var autoCap: Boolean
                  get() = sp.getBoolean("autoCap", true)
                  set(v) { sp.edit().putBoolean("autoCap", v).apply() }

              /** Включённые языки, например ["ru", "en"] */
              var langs: List<String>
                  get() = (sp.getString("langs", "ru,en") ?: "ru,en").split(",").filter { it.isNotEmpty() }
                  set(v) { sp.edit().putString("langs", v.joinToString(",")).apply() }
          }
          HRN_EOF
          mkdir -p "$(dirname 'app/src/main/java/ru/horrons/keyboard/SettingsActivity.kt')"
          cat > 'app/src/main/java/ru/horrons/keyboard/SettingsActivity.kt' <<'HRN_EOF'
          package ru.horrons.keyboard

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Typeface
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.View
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView

          /** Экран настроек: включение клавиатуры, темы, высота, языки, переключатели. */
          class SettingsActivity : Activity() {

              private lateinit var p: Prefs

              private fun Int.dp(): Int = (this * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  p = Prefs(this)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(16.dp(), 16.dp(), 16.dp(), 32.dp())
                  }
                  val scroll = ScrollView(this)
                  scroll.addView(root)
                  setContentView(scroll)

                  fun title(text: String) = TextView(this).apply {
                      this.text = text
                      textSize = 18f
                      setTypeface(typeface, Typeface.BOLD)
                      setPadding(0, 20.dp(), 0, 8.dp())
                  }

                  root.addView(TextView(this).apply {
                      text = "Horrons Клавиатура"
                      textSize = 26f
                      setTypeface(typeface, Typeface.BOLD)
                  })
                  root.addView(TextView(this).apply {
                      text = "Включи клавиатуру в системе, выбери её по умолчанию и проверь ниже."
                      textSize = 14f
                      setPadding(0, 6.dp(), 0, 12.dp())
                  })

                  // 1. Включить / выбрать
                  root.addView(Button(this).apply {
                      text = "1. Включить клавиатуру в настройках"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) }
                  })
                  root.addView(Button(this).apply {
                      text = "2. Выбрать Horrons Клавиатуру"
                      setOnClickListener {
                          (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker()
                      }
                  })
                  root.addView(EditText(this).apply {
                      hint = "Проверь клавиатуру здесь"
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_CAP_SENTENCES
                  })

                  // 2. Темы
                  root.addView(title("Тема"))
                  val group = RadioGroup(this)
                  Themes.all.forEachIndexed { i, t ->
                      group.addView(RadioButton(this).apply {
                          id = View.generateViewId()
                          text = t.name
                          isChecked = i == p.theme
                          setOnClickListener { p.theme = i }
                      })
                  }
                  root.addView(group)

                  // 3. Высота
                  val heightLabel = TextView(this)
                  fun updHeight() {
                      heightLabel.text = "Высота клавиш: ${p.height}%"
                  }
                  updHeight()
                  root.addView(title("Размер"))
                  root.addView(heightLabel)
                  root.addView(SeekBar(this).apply {
                      max = 60
                      progress = p.height - 70
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(sb: SeekBar, value: Int, fromUser: Boolean) {
                              p.height = 70 + value
                              updHeight()
                          }

                          override fun onStartTrackingTouch(sb: SeekBar) {}
                          override fun onStopTrackingTouch(sb: SeekBar) {}
                      })
                  })

                  // 4. Языки
                  root.addView(title("Языки"))
                  val order = listOf("ru", "en", "uk")
                  val boxes = ArrayList<CheckBox>()
                  order.forEach { code ->
                      val cb = CheckBox(this).apply {
                          text = Layouts.names[code]
                          isChecked = code in p.langs
                      }
                      boxes.add(cb)
                      root.addView(cb)
                  }
                  boxes.forEachIndexed { idx, cb ->
                      cb.setOnCheckedChangeListener { _, _ ->
                          val chosen = order.filterIndexed { i, _ -> boxes[i].isChecked }
                          if (chosen.isEmpty()) {
                              // хотя бы один язык должен остаться
                              cb.isChecked = true
                          } else {
                              p.langs = chosen
                          }
                      }
                  }

                  // 5. Переключатели
                  root.addView(title("Поведение"))
                  fun sw(label: String, get: () -> Boolean, set: (Boolean) -> Unit) {
                      root.addView(Switch(this).apply {
                          text = label
                          isChecked = get()
                          setPadding(0, 8.dp(), 0, 8.dp())
                          setOnCheckedChangeListener { _, v -> set(v) }
                      })
                  }
                  sw("Ряд с цифрами", { p.numberRow }, { p.numberRow = it })
                  sw("Превью символов", { p.preview }, { p.preview = it })
                  sw("Вибрация при нажатии", { p.vibrate }, { p.vibrate = it })
                  sw("Звук при нажатии", { p.sound }, { p.sound = it })
                  sw("Заглавная в начале предложения", { p.autoCap }, { p.autoCap = it })
              }
          }
          HRN_EOF
          mkdir -p "$(dirname 'app/src/main/java/ru/horrons/keyboard/Themes.kt')"
          cat > 'app/src/main/java/ru/horrons/keyboard/Themes.kt' <<'HRN_EOF'
          package ru.horrons.keyboard

          import android.graphics.Color

          private fun c(s: String): Int = Color.parseColor(s)

          class KbTheme(
              val name: String,
              val bg: Int,
              val key: Int,
              val special: Int,
              val text: Int,
              val hint: Int,
              val accent: Int,
              val accentText: Int,
              val pressed: Int,
              val preview: Int
          )

          object Themes {
              val all: List<KbTheme> = listOf(
                  KbTheme("Тёмная", c("#1C1C1F"), c("#3B3B40"), c("#2B2B2F"), c("#F2F2F4"), c("#8E8E96"), c("#FFD27F"), c("#1A0F05"), c("#5A5A62"), c("#5A5A62")),
                  KbTheme("Светлая", c("#D9DCE1"), c("#FFFFFF"), c("#B9BEC7"), c("#1B1B1F"), c("#6B6F78"), c("#FFCC33"), c("#1B1B1F"), c("#C5C9D1"), c("#FFFFFF")),
                  KbTheme("Ночь (AMOLED)", c("#000000"), c("#1A1A1A"), c("#0F0F0F"), c("#FFFFFF"), c("#777777"), c("#3DDC84"), c("#001A0A"), c("#333333"), c("#2A2A2A")),
                  KbTheme("Синяя", c("#0F1B33"), c("#22355C"), c("#18284A"), c("#EAF1FF"), c("#8FA6D6"), c("#4A8AFF"), c("#FFFFFF"), c("#3A5188"), c("#3A5188")),
                  KbTheme("Зелёная", c("#0E2217"), c("#1E4430"), c("#143222"), c("#E8FFF1"), c("#8FC9A6"), c("#3DDC84"), c("#04210F"), c("#2F6A4A"), c("#2F6A4A")),
                  KbTheme("Рогатый (красная)", c("#1A0808"), c("#3A1412"), c("#2A0D0C"), c("#FFE9E6"), c("#C98F89"), c("#E5484D"), c("#FFFFFF"), c("#6A2622"), c("#6A2622"))
              )

              fun get(i: Int): KbTheme = all[i.coerceIn(0, all.lastIndex)]
          }
          HRN_EOF
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_launcher.xml')"
          cat > 'app/src/main/res/drawable/ic_launcher.xml' <<'HRN_EOF'
