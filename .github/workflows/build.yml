                  }
                  val scroll = ScrollView(this)
                  scroll.addView(root)
                  setContentView(scroll)

                  fun title(text: String) = TextView(this).apply {
                      this.text = text
                      textSize = 18f
                      setTypeface(typeface, Typeface.BOLD)
                      setPadding(0, 20.dp(), 0, 8.dp())
                  }

                  fun note(text: String) = TextView(this).apply {
                      this.text = text
                      textSize = 13f
                      setPadding(0, 2.dp(), 0, 6.dp())
                  }

                  root.addView(TextView(this).apply {
                      text = "Horrons Клавиатура"
                      textSize = 26f
                      setTypeface(typeface, Typeface.BOLD)
                  })
                  root.addView(note("Включи клавиатуру в системе, выбери её по умолчанию и проверь ниже."))

                  // 1. Включить / выбрать
