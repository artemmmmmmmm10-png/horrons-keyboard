          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'HRN_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          HRN_EOF
          mkdir -p "$(dirname 'settings.gradle.kts')"
          cat > 'settings.gradle.kts' <<'HRN_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HorronsKeyboard"
          include(":app")
          HRN_EOF

      - name: Собрать APK
        working-directory: HorronsKeyboard
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Сохранить APK как файл сборки
        uses: actions/upload-artifact@v4
        with:
          name: HorronsKeyboard-apk
          path: HorronsKeyboard/app/build/outputs/apk/debug/app-debug.apk

      - name: Выложить APK в Releases (прямая ссылка для скачивания)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp HorronsKeyboard/app/build/outputs/apk/debug/app-debug.apk HorronsKeyboard.apk
          gh release create "build-${{ github.run_number }}" HorronsKeyboard.apk --title "Horrons Клавиатура, сборка ${{ github.run_number }}" --notes "Скачай HorronsKeyboard.apk и установи на телефон."
