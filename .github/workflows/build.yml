          package ru.horrons.keyboard

          import android.content.Context
          import android.content.SharedPreferences

          /** Настройки клавиатуры. Хранятся в SharedPreferences и общие для сервиса и экрана настроек. */
          class Prefs(ctx: Context) {
              private val sp: SharedPreferences = ctx.getSharedPreferences("kb", Context.MODE_PRIVATE)

              var theme: Int
                  get() = sp.getInt("theme", 0)
                  set(v) { sp.edit().putInt("theme", v).apply() }

              /** Высота клавиш в процентах: 70..130 */
              var height: Int
                  get() = sp.getInt("height", 100)
                  set(v) { sp.edit().putInt("height", v).apply() }

              var vibrate: Boolean
                  get() = sp.getBoolean("vibrate", true)
                  set(v) { sp.edit().putBoolean("vibrate", v).apply() }

              var sound: Boolean
                  get() = sp.getBoolean("sound", false)
                  set(v) { sp.edit().putBoolean("sound", v).apply() }

              var preview: Boolean
                  get() = sp.getBoolean("preview", true)
                  set(v) { sp.edit().putBoolean("preview", v).apply() }

              var numberRow: Boolean
                  get() = sp.getBoolean("numberRow", true)
                  set(v) { sp.edit().putBoolean("numberRow", v).apply() }

              var autoCap: Boolean
                  get() = sp.getBoolean("autoCap", true)
                  set(v) { sp.edit().putBoolean("autoCap", v).apply() }

              /** Включённые языки, например ["ru", "en"] */
              var langs: List<String>
                  get() = (sp.getString("langs", "ru,en") ?: "ru,en").split(",").filter { it.isNotEmpty() }
                  set(v) { sp.edit().putString("langs", v.joinToString(",")).apply() }

              /** Переводчик: язык исходного текста ("auto" — определить сам) */
              var trSrc: String
                  get() = sp.getString("trSrc", "auto") ?: "auto"
                  set(v) { sp.edit().putString("trSrc", v).apply() }

              /** Переводчик: язык, на который переводим */
              var trDst: String
                  get() = sp.getString("trDst", "en") ?: "en"
                  set(v) { sp.edit().putString("trDst", v).apply() }

              /** Horrons AI: адрес сервера, ключ и модель */
              var aiUrl: String
                  get() = sp.getString("aiUrl", "https://api.anthropic.com") ?: "https://api.anthropic.com"
                  set(v) { sp.edit().putString("aiUrl", v).apply() }

              var aiKey: String
                  get() = sp.getString("aiKey", "") ?: ""
                  set(v) { sp.edit().putString("aiKey", v).apply() }

              var aiModel: String
                  get() = sp.getString("aiModel", "claude-haiku-5-5") ?: "claude-haiku-5-5"
                  set(v) { sp.edit().putString("aiModel", v).apply() }
          }
