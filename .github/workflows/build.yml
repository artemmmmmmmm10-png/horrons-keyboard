              // ----- буфер обмена -----
              private var clip: String? = null
              private var clipDismissed: String? = null
              private val clipHist = ArrayList<String>()
              private val clipListener = ClipboardManager.OnPrimaryClipChangedListener {
                  loadClip()
                  clipDismissed = null
                  kv?.invalidate()
              }

              private fun loadClip() {
                  var sensitive = false
                  clip = try {
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      val d = cm.primaryClip
                      if (d != null) {
                          sensitive = d.description?.extras?.getBoolean("android.content.extra.IS_SENSITIVE", false) == true
                      }
                      if (d != null && d.itemCount > 0) d.getItemAt(0).coerceToText(this)?.toString()?.trim() else null
                  } catch (e: Exception) {
                      null
                  }
                  val t = clip
                  if (prefs.clipHistory && !password && !sensitive && !t.isNullOrEmpty() && t.length <= 2000) {
                      if (clipHist.isEmpty() || clipHist[0] != t) {
                          clipHist.remove(t)
                          clipHist.add(0, t)
                          while (clipHist.size > 25) clipHist.removeAt(clipHist.size - 1)
                      }
                  }
                  if (sensitive) clip = null
              }

              override fun onCreate() {
                  super.onCreate()
                  prefs = Prefs(this)
                  Dict.init(this)
                  try {
                      (getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager).addPrimaryClipChangedListener(clipListener)
                  } catch (e: Exception) {
                  }
                  loadClip()
              }

              override fun onDestroy() {
                  stopVoice()
                  try {
                      (getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager).removePrimaryClipChangedListener(clipListener)
                  } catch (e: Exception) {
                  }
                  super.onDestroy()
              }

              override fun onEvaluateFullscreenMode(): Boolean = false

              override fun onCreateInputView(): View {
                  val v = KeyboardView(this, this)
                  kv = v
                  return v
              }

              override fun onFinishInputView(finishingInput: Boolean) {
                  stopVoice()
                  super.onFinishInputView(finishingInput)
              }

              override fun onStartInputView(info: EditorInfo, restarting: Boolean) {
                  super.onStartInputView(info, restarting)
                  val cls = info.inputType and InputType.TYPE_MASK_CLASS
                  val variation = info.inputType and InputType.TYPE_MASK_VARIATION
                  val numeric = cls == InputType.TYPE_CLASS_NUMBER || cls == InputType.TYPE_CLASS_PHONE
                  password = (cls == InputType.TYPE_CLASS_TEXT && (
                          variation == InputType.TYPE_TEXT_VARIATION_PASSWORD ||
                                  variation == InputType.TYPE_TEXT_VARIATION_VISIBLE_PASSWORD ||
                                  variation == InputType.TYPE_TEXT_VARIATION_WEB_PASSWORD)) ||
                          (cls == InputType.TYPE_CLASS_NUMBER && variation == InputType.TYPE_NUMBER_VARIATION_PASSWORD)

                  val langs = prefs.langs.ifEmpty { listOf("ru") }
                  if (lang !in langs) lang = langs[0]
                  curPkg = info.packageName ?: ""
                  if (prefs.perAppLang && !password && curPkg.isNotEmpty()) {
                      val saved = prefs.appLang(curPkg)
                      if (saved != null && saved in langs) lang = saved
                  }
                  if (password && "en" in langs) lang = "en"

                  symbols = numeric
                  page = 0
                  shift = 0
                  loadClip()

                  // сбрасываем панели и устаревшие запросы
                  mode = 0
                  panel = 0
                  panelVer++
                  toolsOpen = false
                  revertCorr = null
                  token++
                  busy = false
                  stopVoice()
                  undoText = null
                  ui.removeCallbacks(clearRun)
                  status = null

                  enterLabel = when (info.imeOptions and EditorInfo.IME_MASK_ACTION) {
                      EditorInfo.IME_ACTION_SEARCH -> "🔍"
                      EditorInfo.IME_ACTION_SEND -> "➤"
                      EditorInfo.IME_ACTION_GO, EditorInfo.IME_ACTION_NEXT, EditorInfo.IME_ACTION_PREVIOUS -> "→"
                      EditorInfo.IME_ACTION_DONE -> "✓"
                      else -> "↵"
                  }
                  updateShift()
                  updateSugg()
                  kv?.refresh()
              }

              override fun onUpdateSelection(
                  oldSelStart: Int, oldSelEnd: Int,
                  newSelStart: Int, newSelEnd: Int,
                  candidatesStart: Int, candidatesEnd: Int
              ) {
                  super.onUpdateSelection(oldSelStart, oldSelEnd, newSelStart, newSelEnd, candidatesStart, candidatesEnd)
                  val before = shift
                  updateShift()
                  updateSugg()
                  if (before != shift) kv?.refresh() else kv?.invalidate()
              }

              /** Строки раскладки для текущего состояния. */
              fun rows(): List<List<Key>> =
                  Layouts.build(
                      lang, symbols, page, shift > 0, prefs.numberRow, enterLabel,
                      prefs.globe, prefs.globeRight, prefs.commaKey
                  )

              /** Автозаглавная буква в начале предложения. */
              private fun updateShift() {
                  if (shift == 2) return
                  if (!prefs.autoCap || password || symbols) {
                      shift = 0
                      return
                  }
                  val ic = currentInputConnection
                  val ei = currentInputEditorInfo
                  shift = if (ic != null && ei != null && ei.inputType != 0 &&
                      ic.getCursorCapsMode(ei.inputType) != 0
                  ) 1 else 0
              }

              /** Общее действие после любого изменения текста. */
              private fun afterEdit() {
                  val before = shift
                  updateShift()
                  updateSugg()
                  if (before != shift) kv?.refresh() else kv?.invalidate()
              }

              // ================= подсказки слов =================

              private fun prevWord(b: String, j: Int): String {
                  if (j < 2 || b[j - 1] != ' ') return ""
                  var k = j - 1
                  while (k > 0 && b[k - 1].isLetter()) k--
                  return b.substring(k, j - 1)
              }

              private fun updateSugg() {
                  var out: List<String> = emptyList()
                  val ic = currentInputConnection
                  if (ic != null && prefs.suggest && !password && !symbols && mode == 0 && panel == 0 && status == null) {
                      val b = ic.getTextBeforeCursor(40, 0)?.toString() ?: ""
                      var j = b.length
                      while (j > 0 && (b[j - 1].isLetter() || b[j - 1] == '\'')) j--
                      val cur = b.substring(j)
                      out = if (cur.isNotEmpty()) {
                          Dict.suggest(lang, cur, 3)
                      } else if (b.endsWith(" ")) {
                          Dict.nextWords(lang, prevWord(b, j), 3)
                      } else {
                          emptyList()
                      }
                  }
                  sugg = out
              }

              private fun pickSuggestion(i: Int) {
                  val s = sugg.getOrNull(i) ?: return
                  val ic = currentInputConnection ?: return
                  val b = ic.getTextBeforeCursor(40, 0)?.toString() ?: ""
                  var j = b.length
                  while (j > 0 && (b[j - 1].isLetter() || b[j - 1] == '\'')) j--
                  val cur = b.substring(j)
                  if (prefs.learn && !password) {
                      Dict.learn(lang, s)
                      Dict.learnPair(lang, prevWord(b, j), s)
                  }
                  if (cur.isNotEmpty()) ic.deleteSurroundingText(cur.length, 0)
                  ic.commitText("$s ", 1)
                  revertCorr = null
                  afterEdit()
              }

              private fun isBreak(c: Char): Boolean = !c.isLetterOrDigit() && c != '\'' && c != '-' && c != '_'

              /** Вызывается при вводе пробела или знака после слова: обучение и автоисправление. Возвращает true, если ввод уже сделан. */
              private fun wordBreak(ic: InputConnection, text: String): Boolean {
                  if (!prefs.learn && !prefs.autoCorrect) return false
                  val b = ic.getTextBeforeCursor(40, 0)?.toString() ?: return false
                  var i = b.length
                  while (i > 0 && (b[i - 1].isLetter() || b[i - 1] == '\'')) i--
                  val word = b.substring(i)
                  if (word.isEmpty()) return false
                  val prev = prevWord(b, i)
                  var fixed: String? = null
                  if (prefs.autoCorrect) fixed = Dict.correct(lang, word)
                  if (fixed != null) {
                      ic.deleteSurroundingText(word.length, 0)
                      ic.commitText(fixed + text, 1)
                      revertCorr = fixed
                      revertOrig = word
                      revertTail = text
                      if (prefs.learn) Dict.learnPair(lang, prev, fixed)
                      return true
                  }
                  if (prefs.learn) {
                      Dict.learn(lang, word)
                      Dict.learnPair(lang, prev, word)
                  }
                  return false
              }

              // ================= ввод =================

              fun type(text: String) {
                  val ic = currentInputConnection
                  var done = false
                  revertCorr = null
                  toolsOpen = false
                  if (ic != null && !password && ic.getSelectedText(0).isNullOrEmpty()) {
                      if (text == " " && prefs.dblSpace) {
                          // два пробела подряд после слова → точка и пробел
                          val b = ic.getTextBeforeCursor(2, 0)?.toString()
                          if (b != null && b.length == 2 && b[1] == ' ' && (b[0].isLetterOrDigit() || b[0] == ')')) {
                              ic.deleteSurroundingText(1, 0)
                              ic.commitText(". ", 1)
                              done = true
                          }
                      } else if (text == "-" && prefs.smartDash) {
                          // два дефиса подряд → тире
                          val b = ic.getTextBeforeCursor(2, 0)?.toString()
                          if (b != null && b.endsWith("-") && !b.startsWith("-")) {
                              ic.deleteSurroundingText(1, 0)
                              ic.commitText("—", 1)
                              done = true
                          }
                      }
                      if (!done && text.length == 1 && isBreak(text[0])) done = wordBreak(ic, text)
                  }
                  if (!done) ic?.commitText(text, 1)
                  if (shift == 1) shift = 0
                  afterEdit()
              }

              fun backspace() {
                  val ic = currentInputConnection ?: return
                  val rc = revertCorr
                  if (rc != null) {
                      // сразу после автоисправления Backspace возвращает слово как было
                      ic.deleteSurroundingText(rc.length + revertTail.length, 0)
                      ic.commitText(revertOrig + revertTail, 1)
                      if (prefs.learn) {
                          Dict.learn(lang, revertOrig)
                          Dict.learn(lang, revertOrig)
                      }
                      revertCorr = null
                      afterEdit()
                      return
                  }
                  val sel = ic.getSelectedText(0)
                  if (sel != null && sel.isNotEmpty()) {
                      ic.commitText("", 1)
                  } else {
                      sendDownUpKeyEvents(KeyEvent.KEYCODE_DEL)
                  }
                  afterEdit()
              }

              /** Удаляет слово слева от курсора (или выделенный текст). */
              fun deleteWord() {
                  val ic = currentInputConnection ?: return
                  revertCorr = null
                  val sel = ic.getSelectedText(0)
                  if (sel != null && sel.isNotEmpty()) {
                      ic.commitText("", 1)
                  } else {
                      val b = ic.getTextBeforeCursor(100, 0)?.toString() ?: ""
                      if (b.isEmpty()) {
                          sendDownUpKeyEvents(KeyEvent.KEYCODE_DEL)
                      } else {
                          var i = b.length
                          while (i > 0 && b[i - 1].isWhitespace()) i--
                          while (i > 0 && !b[i - 1].isWhitespace()) i--
                          ic.deleteSurroundingText(maxOf(1, b.length - i), 0)
                      }
                  }
                  afterEdit()
              }

              /** Сдвигает курсор: -1 влево, 1 вправо. */
              fun moveCursor(dir: Int) {
                  sendDownUpKeyEvents(if (dir < 0) KeyEvent.KEYCODE_DPAD_LEFT else KeyEvent.KEYCODE_DPAD_RIGHT)
              }

              fun enter() {
                  val ei = currentInputEditorInfo
                  val ic = currentInputConnection ?: return
                  revertCorr = null
                  if (ei == null) {
                      sendDownUpKeyEvents(KeyEvent.KEYCODE_ENTER)
                      return
                  }
                  val action = ei.imeOptions and EditorInfo.IME_MASK_ACTION
                  val multiLine = (ei.inputType and InputType.TYPE_TEXT_FLAG_MULTI_LINE) != 0
                  val noAction = (ei.imeOptions and EditorInfo.IME_FLAG_NO_ENTER_ACTION) != 0
                  if (!multiLine && !noAction &&
                      action != EditorInfo.IME_ACTION_NONE && action != EditorInfo.IME_ACTION_UNSPECIFIED
                  ) {
                      ic.performEditorAction(action)
                  } else {
                      sendDownUpKeyEvents(KeyEvent.KEYCODE_ENTER)
                  }
              }

              fun onShift() {
                  val now = SystemClock.uptimeMillis()
                  shift = when {
                      shift == 1 && now - lastShiftTap < 350 -> 2
                      shift != 0 -> 0
                      else -> 1
                  }
                  lastShiftTap = now
                  kv?.refresh()
              }

              fun toggleSymbols() {
                  symbols = !symbols
                  page = 0
                  if (symbols) shift = 0 else updateShift()
                  updateSugg()
                  kv?.refresh()
              }

              fun togglePage() {
                  page = 1 - page
                  kv?.refresh()
              }

              fun nextLang() = switchLang(1, true)

              /** Переключает язык: dir 1 — следующий, -1 — предыдущий. */
              fun switchLang(dir: Int, picker: Boolean = false) {
                  val langs = prefs.langs.ifEmpty { listOf("ru") }
                  if (langs.size <= 1) {
                      if (picker) showPicker()
                      return
                  }
                  val i = langs.indexOf(lang).coerceAtLeast(0)
                  lang = langs[((i + dir) % langs.size + langs.size) % langs.size]
                  if (prefs.perAppLang && !password && curPkg.isNotEmpty()) prefs.setAppLang(curPkg, lang)
                  symbols = false
                  page = 0
                  updateShift()
                  updateSugg()
                  kv?.refresh()
              }

              fun showPicker() {
                  val imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                  imm.showInputMethodPicker()
              }

              // ================= панели =================

              fun showPanel(p: Int) {
                  panel = p
                  panelVer++
                  if (p != 0) mode = 0
                  updateSugg()
                  kv?.invalidate()
              }

              private fun panelTitle(): String = when (panel) {
                  1 -> "Эмодзи"
                  2 -> "Буфер обмена"
                  3 -> "Horrons AI"
                  else -> "Ответ Horrons AI"
              }

              fun panelCols(): Int = when (panel) {
                  1 -> 8
                  3 -> 3
                  else -> 1
              }

              /** Если это панель с текстом, возвращает текст. */
              fun panelText(): String? = if (panel == 4) aiResult else null

              fun panelCells(): List<Cell> {
                  val out = ArrayList<Cell>()
                  when (panel) {
                      1 -> {
                          val items = if (emojiCat < 0) {
                              prefs.recentEmoji.split(" ").filter { it.isNotEmpty() }
                          } else {
                              Emoji.cats[emojiCat.coerceIn(0, Emoji.cats.lastIndex)].items
                          }
                          if (items.isEmpty()) out.add(Cell("", "Здесь появятся недавние эмодзи", 3))
                          for (e in items) out.add(Cell("e:$e", e, 2))
                      }
                      2 -> {
                          if (clipHist.isEmpty()) {
                              out.add(Cell("", "Буфер пуст. Скопируйте текст, и он появится здесь.", 3))
                          }
                          clipHist.forEachIndexed { i, t ->
                              out.add(Cell("h:$i", t.replace('\n', ' ').take(120), 3))
                          }
                      }
                      3 -> {
                          out.add(Cell("ai:fix", "Исправить"))
                          out.add(Cell("ai:punct", "Знаки препинания"))
                          out.add(Cell("ai:improve", "Улучшить текст"))
                          out.add(Cell("ai:rephrase", "Перефразировать"))
                          out.add(Cell("ai:short", "Короче"))
                          out.add(Cell("ai:polite", "Вежливее"))
                          out.add(Cell("ai:formal", "Деловой стиль"))
                          out.add(Cell("ai:casual", "Простой стиль"))
                          out.add(Cell("ai:friendly", "Дружелюбный"))
                          out.add(Cell("ai:cont", "Продолжить"))
                          out.add(Cell("ai:reply", "Ответ на сообщение"))
                          out.add(Cell("ai:explain", "Объяснить ошибки"))
                          out.add(Cell("ai:ask", "Спросить ИИ", 1))
                          if (undoText != null) out.add(Cell("undo", "↩ Вернуть", 1))
                      }
                  }
                  return out
              }

              fun panelTabs(): List<Cell> {
                  val out = ArrayList<Cell>()
                  when (panel) {
                      1 -> {
                          out.add(Cell("abc", "ABC"))
                          out.add(Cell("cat:-1", "🕘", if (emojiCat < 0) 1 else 0))
                          Emoji.cats.forEachIndexed { i, c -> out.add(Cell("cat:$i", c.icon, if (emojiCat == i) 1 else 0)) }
                          out.add(Cell("clips", "📋"))
                          out.add(Cell("bs", "⌫"))
                      }
                      2 -> {
                          out.add(Cell("abc", "ABC"))
                          out.add(Cell("emoji", "😀"))
                          out.add(Cell("hclear", "🗑 Очистить"))
                          out.add(Cell("bs", "⌫"))
                      }
                      3 -> {
                          out.add(Cell("abc", "ABC"))
                      }
                      4 -> {
                          out.add(Cell("ai", "← Назад"))
                          out.add(Cell("insert", "Вставить", 1))
                          out.add(Cell("abc", "ABC"))
                      }
                  }
                  return out
              }

              fun onCell(id: String) {
                  if (id.isEmpty()) return
                  when {
                      id == "abc" -> showPanel(0)
                      id == "bs" -> backspace()
                      id == "emoji" -> showPanel(1)
                      id == "clips" -> showPanel(2)
                      id == "ai" -> showPanel(3)
                      id == "undo" -> {
                          doUndo()
                          showPanel(0)
                      }
                      id == "hclear" -> {
                          clipHist.clear()
                          clipDismissed = clip
                          kv?.invalidate()
                      }
                      id == "insert" -> {
                          currentInputConnection?.commitText(aiResult, 1)
                          showPanel(0)
                          afterEdit()
                      }
                      id.startsWith("cat:") -> {
                          emojiCat = id.substring(4).toIntOrNull() ?: 0
                          panelVer++
                          kv?.invalidate()
                      }
                      id.startsWith("e:") -> insertEmoji(id.substring(2))
                      id.startsWith("h:") -> {
                          val i = id.substring(2).toIntOrNull() ?: -1
                          val t = clipHist.getOrNull(i)
                          if (t != null) {
                              currentInputConnection?.commitText(t, 1)
                              showPanel(0)
                              afterEdit()
                          }
                      }
                      id.startsWith("ai:") -> doAi(id.substring(3))
                  }
              }

              private fun insertEmoji(e: String) {
                  currentInputConnection?.commitText(e, 1)
                  val r = prefs.recentEmoji.split(" ").filter { it.isNotEmpty() && it != e }.toMutableList()
                  r.add(0, e)
                  while (r.size > 32) r.removeAt(r.size - 1)
                  prefs.recentEmoji = r.joinToString(" ")
              }

              // ================= панель инструментов =================

              /** Кнопки верхней панели. */
              fun toolbar(): List<Chip> {
                  val st = status
                  if (st != null) {
                      return listOf(
                          Chip("", st, if (statusErr) 3 else 2),
                          Chip("clear", if (busy) "✕" else "OK")
                      )
                  }
                  if (panel != 0) {
                      return listOf(Chip("", panelTitle(), 2), Chip("pclose", "✕"))
                  }
                  val out = ArrayList<Chip>()
                  if (mode == 1) {
                      out.add(Chip("src", if (prefs.trSrc == "auto") "Авто" else prefs.trSrc.uppercase()))
                      out.add(Chip("dst", "→ " + prefs.trDst.uppercase()))
                      out.add(Chip("go", "Перевести", 1))
                      if (undoText != null) out.add(Chip("undo", "↩"))
                      out.add(Chip("close", "✕"))
                  } else if (!toolsOpen && sugg.isNotEmpty()) {
                      out.add(Chip("tools", "⋯"))
                      sugg.forEachIndexed { i, w -> out.add(Chip("s$i", w)) }
                  } else {
                      out.add(Chip("tr", "🌐 Перевод"))
                      if (prefs.aiOn) out.add(Chip("ai", "✨ AI"))
                      out.add(Chip("emoji", "😀"))
                      out.add(Chip("mic", "🎤"))
                      val cl = clip
                      if (prefs.clipSuggest && !password && !cl.isNullOrBlank() && cl != clipDismissed) {
                          val one = cl.replace('\n', ' ')
                          out.add(Chip("clip", "📋 " + (if (one.length > 10) one.take(10) + "…" else one)))
                      }
                  }
                  return out
              }

              fun onTool(id: String) {
                  if (busy && id != "clear") return
                  when (id) {
                      "tr" -> {
                          mode = 1
                          kv?.invalidate()
                      }
                      "ai" -> {
                          if (!prefs.aiOn) setStatus("Horrons AI выключен в настройках приложения", true, 4000) else showPanel(3)
                      }
                      "emoji" -> showPanel(1)
                      "mic" -> startVoice()
                      "tools" -> {
                          toolsOpen = true
                          kv?.invalidate()
                      }
                      "pclose" -> showPanel(0)
                      "close" -> {
                          mode = 0
                          setStatus(null)
                          updateSugg()
                      }
                      "clear" -> {
                          token++
                          busy = false
                          stopVoice()
                          setStatus(null)
                      }
                      "src" -> {
                          val i = srcList.indexOf(prefs.trSrc)
                          prefs.trSrc = srcList[(i + 1) % srcList.size]
                          kv?.invalidate()
                      }
                      "dst" -> {
                          val l = srcList.drop(1)
                          val i = l.indexOf(prefs.trDst)
                          prefs.trDst = l[(i + 1) % l.size]
                          kv?.invalidate()
                      }
                      "clip" -> {
                          val t = clip
                          if (!t.isNullOrEmpty()) {
                              currentInputConnection?.commitText(t, 1)
                              if (prefs.clipClose) clipDismissed = t
                              afterEdit()
                          }
                      }
                      "go" -> doTranslate()
                      "undo" -> doUndo()
                      "s0" -> pickSuggestion(0)
                      "s1" -> pickSuggestion(1)
                      "s2" -> pickSuggestion(2)
                  }
              }

              private fun setStatus(msg: String?, err: Boolean = false, ms: Long = 2500) {
                  status = msg
                  statusErr = err
                  ui.removeCallbacks(clearRun)
                  if (msg != null && !busy && ms > 0) ui.postDelayed(clearRun, ms)
                  if (msg == null) updateSugg()
                  kv?.invalidate()
              }

              private class Job(val orig: String, val sel: Boolean, val before: Int, val after: Int)

              /** Текст для обработки: выделенный или весь текст поля вокруг курсора. */
              private fun readField(): Job? {
                  val ic = currentInputConnection ?: return null
                  val sel = ic.getSelectedText(0)
                  if (sel != null && sel.isNotEmpty()) return Job(sel.toString(), true, 0, 0)
                  val b = ic.getTextBeforeCursor(3000, 0)?.toString() ?: ""
                  val a = ic.getTextAfterCursor(3000, 0)?.toString() ?: ""
                  val all = b + a
                  return if (all.isBlank()) null else Job(all, false, b.length, a.length)
              }

              /** Заменяет исходный текст результатом. false, если за время ожидания текст изменился. */
              private fun applyJob(job: Job, result: String): Boolean {
                  val ic = currentInputConnection ?: return false
                  val now = readField()
                  if (now == null || now.orig != job.orig) return false
                  if (!job.sel) ic.deleteSurroundingText(job.before, job.after)
                  ic.commitText(result, 1)
                  undoText = job.orig
                  return true
              }

              /** Дописывает продолжение в позиции курсора. */
              private fun appendJob(job: Job, result: String): Boolean {
                  val ic = currentInputConnection ?: return false
                  val now = readField()
                  if (now == null || now.orig != job.orig) return false
                  val needSpace = job.orig.isNotEmpty() && !job.orig.last().isWhitespace() &&
                          result.isNotEmpty() && !result.first().isWhitespace()
                  val add = (if (needSpace) " " else "") + result
                  if (job.sel) ic.commitText(job.orig + add, 1) else ic.commitText(add, 1)
                  undoText = job.orig
                  return true
              }

              private fun doUndo() {
                  val u = undoText ?: return
                  val ic = currentInputConnection ?: return
                  val job = readField()
                  if (job != null && !job.sel) ic.deleteSurroundingText(job.before, job.after)
                  ic.commitText(u, 1)
                  undoText = null
                  setStatus("Возвращено", false, 1500)
                  afterEdit()
              }

              private fun doTranslate() {
                  if (password) {
                      setStatus("В полях пароля перевод отключён", true)
                      return
                  }
                  val job = readField() ?: run {
                      setStatus("Сначала напишите текст в поле", true)
                      return
                  }
                  busy = true
                  val my = ++token
                  setStatus("Перевожу…", false)
                  Tr.translate(job.orig, prefs.trSrc, prefs.trDst) { res, err ->
                      if (my == token) {
                          busy = false
                          if (res != null) {
                              if (applyJob(job, res)) setStatus("Готово", false, 1200)
                              else setStatus("Текст изменился, повторите", true)
                          } else {
                              setStatus(err ?: "Ошибка перевода", true, 5000)
                          }
                      }
                  }
              }

              private fun doAi(kind: String) {
                  if (!prefs.aiOn) {
                      setStatus("Horrons AI выключен в настройках приложения", true, 4000)
                      return
                  }
                  if (password) {
                      setStatus("В полях пароля помощник отключён", true)
                      return
                  }
                  if (prefs.aiKey.isBlank()) {
                      setStatus("Нужен ключ API. Откройте приложение Horrons Клавиатура, раздел Horrons AI.", true, 6000)
                      return
                  }
                  val job = readField() ?: run {
                      setStatus("Сначала напишите текст в поле", true)
                      return
                  }
                  busy = true
                  val my = ++token
                  setStatus("Horrons AI думает…", false)
                  Ai.ask(prefs.aiUrl, prefs.aiKey, prefs.aiModel, sys.getValue(kind), job.orig) { res, err ->
                      if (my == token) {
                          busy = false
                          if (res != null) {
                              when (kind) {
                                  "explain" -> {
                                      aiResult = res
                                      setStatus(null)
                                      showPanel(4)
                                  }
                                  "cont" -> {
                                      if (appendJob(job, res)) {
                                          showPanel(0)
                                          setStatus("Готово", false, 1200)
                                          afterEdit()
                                      } else {
                                          setStatus("Текст изменился, повторите", true)
                                      }
                                  }
                                  else -> {
                                      if (applyJob(job, res)) {
                                          showPanel(0)
                                          setStatus("Готово", false, 1200)
                                          afterEdit()
                                      } else {
                                          setStatus("Текст изменился, повторите", true)
                                      }
                                  }
                              }
                          } else {
                              setStatus(err ?: "Ошибка Horrons AI", true, 6000)
                          }
                      }
                  }
              }

              // ================= голосовой ввод =================

              private var rec: SpeechRecognizer? = null

              private fun stopVoice() {
                  try {
                      rec?.cancel()
                      rec?.destroy()
                  } catch (e: Exception) {
                  }
                  rec = null
              }

              private fun voiceTag(): String = when (lang) {
                  "ru" -> "ru-RU"
                  "uk" -> "uk-UA"
                  "de" -> "de-DE"
                  "fr" -> "fr-FR"
                  "es" -> "es-ES"
                  "it" -> "it-IT"
                  "pt" -> "pt-BR"
                  "pl" -> "pl-PL"
                  "tr" -> "tr-TR"
                  "en" -> "en-US"
                  else -> lang
              }

              private fun startVoice() {
                  if (password) {
                      setStatus("В полях пароля голосовой ввод отключён", true)
                      return
                  }
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      try {
                          val i = Intent(this, MicActivity::class.java)
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          startActivity(i)
                      } catch (e: Exception) {
                      }
                      setStatus("Разрешите доступ к микрофону и нажмите 🎤 ещё раз", true, 5000)
                      return
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      setStatus("Распознавание речи недоступно на этом телефоне", true, 4000)
                      return
                  }
                  stopVoice()
                  val r = SpeechRecognizer.createSpeechRecognizer(this)
                  rec = r
                  val my = ++token
                  busy = true
                  setStatus("Говорите…", false)
                  r.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(params: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(rmsdB: Float) {}
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onPartialResults(partialResults: Bundle?) {}
                      override fun onEvent(eventType: Int, params: Bundle?) {}

                      override fun onResults(results: Bundle?) {
                          if (my != token) return
                          busy = false
                          val list = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          val text = if (list != null && list.isNotEmpty()) list[0] else ""
                          if (text.isNotEmpty()) {
                              val ic = currentInputConnection
                              val b = ic?.getTextBeforeCursor(1, 0)?.toString() ?: ""
                              val lead = if (b.isNotEmpty() && !b[0].isWhitespace()) " " else ""
                              ic?.commitText(lead + text, 1)
                              setStatus(null)
                              afterEdit()
                          } else {
                              setStatus("Не расслышал, повторите", true)
                          }
                      }

                      override fun onError(error: Int) {
                          if (my != token) return
                          busy = false
                          val msg = when (error) {
                              6, 7 -> "Не расслышал, повторите"
                              1, 2 -> "Нет сети для распознавания речи"
                              9 -> "Нет доступа к микрофону"
                              8 -> "Распознавание занято, повторите"
                              else -> "Ошибка голосового ввода ($error)"
                          }
                          setStatus(msg, true, 4000)
                      }
                  })
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, voiceTag())
                  i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, false)
                  r.startListening(i)
              }
          }
          HRN_EOF
          mkdir -p "$(dirname 'app/src/main/java/ru/horrons/keyboard/KeyboardView.kt')"
