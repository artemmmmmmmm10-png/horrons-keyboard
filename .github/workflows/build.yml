                              if (on) {
                                  if (code !in cur) cur.add(code)
                              } else {
                                  cur.remove(code)
                              }
                              if (cur.isEmpty()) cur.add(code)
                              p.langs = cur
                              renderLangs()
                          }
                          if (code in chosen) {
                              fun arrow(sym: String, d: Int) {
                                  row.addView(TextView(this).apply {
                                      text = sym
                                      textSize = 22f
