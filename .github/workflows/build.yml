              private val ltxt = Paint(Paint.ANTI_ALIAS_FLAG).apply { textAlign = Paint.Align.LEFT }
              private val dst = RectF()

              // фон-картинка
              private var bgBmp: Bitmap? = null
              private var bgStamp = 0L

              // панели (эмодзи, буфер, ИИ)
              private var panelTouch = false
              private var pDownX = 0f
              private var pDownY = 0f
              private var pMoved = false
              private var panelScroll = 0f
              private var panelScrollStart = 0f
              private var panelContentH = 0f
              private var panelVerSeen = -1
              private var lastY = 0f

              private var pressed: Slot? = null
              private var pid = -1
              private var longFired = false
              private var topTap = false
              private var topChip: String? = null
              private var lastX = 0f

              // пробел: 0 — обычное нажатие, 1 — режим курсора, 2 — свайп сменил язык
              private var spaceMode = 0
              private var spaceMoved = false
              private var spaceX0 = 0f
              private var spaceAnchor = 0f

              // backspace: счётчик повторов и опорная точка свайпа
              private var repN = 0
              private var delAnchor = 0f
              private var delSwiped = false

              private val density = resources.displayMetrics.density
              private fun dp(v: Float): Float = v * density

              private val topH: Float get() = dp(40f)
              private val gap: Float get() = dp(4f)
              private fun keyH(): Float = dp(42f) * svc.prefs.height / 100f

              fun refresh() {
                  loadBg()
                  requestLayout()
                  invalidate()
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  loadBg()
              }

              private fun loadBg() {
                  if (!svc.prefs.bgImage) {
                      bgBmp = null
                      bgStamp = 0L
                      return
                  }
                  val f = File(context.filesDir, "bg.jpg")
                  if (!f.exists()) {
                      bgBmp = null
                      return
                  }
                  if (bgBmp != null && f.lastModified() == bgStamp) return
                  bgBmp = try {
                      BitmapFactory.decodeFile(f.path)
                  } catch (e: Throwable) {
                      null
                  }
                  bgStamp = f.lastModified()
              }

              /** С фоном-картинкой клавиши делаем чуть прозрачными. */
              private fun fx(col: Int): Int =
                  if (bgBmp != null) ((col and 0x00FFFFFF) or (0xD0 shl 24)) else col

              // ---------- размеры ----------

              private fun layoutSlots(w: Float) {
                  val rows = svc.rows()
                  rowsCount = rows.size
                  val out = ArrayList<Slot>()
                  val padX = dp(3f)
                  val kh = keyH()
                  var y = topH + dp(4f)
                  for (row in rows) {
                      var total = 0f
                      for (k in row) total += k.weight
                      val avail = w - 2 * padX - gap * (row.size - 1)
                      var x = padX
                      for (k in row) {
                          val kw = avail * k.weight / total
                          if (k.kind != Kind.SPACER) out.add(Slot(k, RectF(x, y, x + kw, y + kh)))
                          x += kw + gap
                      }
                      y += kh + gap
                  }
                  slots = out
              }

              private fun totalH(): Float = topH + dp(4f) + rowsCount * (keyH() + gap) + dp(6f)

              override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
                  val w = MeasureSpec.getSize(widthMeasureSpec)
                  layoutSlots(w.toFloat())
                  setMeasuredDimension(w, totalH().toInt())
              }

              // ---------- верхняя панель ----------

              private fun chipSlots(): List<ChipSlot> {
                  val chips = svc.toolbar()
                  val g = dp(6f)
                  val pad = dp(12f)
                  val avail = width - dp(8f) - dp(48f)
                  txt.textSize = dp(13f)
                  val w = FloatArray(chips.size)
                  var total = g * (chips.size - 1)
                  for (i in chips.indices) {
                      val c = chips[i]
                      w[i] = txt.measureText(c.label) + (if (c.kind >= 2) dp(4f) else pad * 2)
                      total += w[i]
                  }
                  if (total > avail) {
                      // сначала сжимаем плашку с текстом состояния
                      for (i in chips.indices) {
                          if (chips[i].kind >= 2) {
                              val others = total - w[i]
                              w[i] = maxOf(dp(60f), avail - others)
                              total = others + w[i]
                          }
                      }
                  }
                  val sc = if (total > avail && total > 0f) avail / total else 1f
                  val out = ArrayList<ChipSlot>()
                  var x = dp(8f)
                  val top = dp(4f)
                  val h = topH - dp(8f)
                  for (i in chips.indices) {
                      val ww = w[i] * sc
                      out.add(ChipSlot(chips[i], RectF(x, top, x + ww, top + h), sc))
                      x += ww + g * sc
                  }
                  return out
              }

              private fun topAt(x: Float): String? {
                  if (x >= width - dp(48f)) return "hide"
                  for (cs in chipSlots()) {
                      if (cs.chip.id.isNotEmpty() && x >= cs.r.left - dp(3f) && x <= cs.r.right + dp(3f)) return cs.chip.id
                  }
                  return null
              }

              // ---------- отрисовка ----------

              override fun onDraw(c: Canvas) {
                  val t = svc.prefs.themeObj()
                  c.drawColor(t.bg)
                  val bmp = bgBmp
                  if (bmp != null) {
                      val sw = bmp.width.toFloat()
                      val sh = bmp.height.toFloat()
                      val sc = maxOf(width / sw, height / sh)
                      val dw = sw * sc
                      val dh = sh * sc
                      dst.set((width - dw) / 2, (height - dh) / 2, (width + dw) / 2, (height + dh) / 2)
                      c.drawBitmap(bmp, null, dst, null)
                      paint.color = (t.bg and 0x00FFFFFF) or ((svc.prefs.bgDim.coerceIn(0, 90) * 255 / 100) shl 24)
                      c.drawRect(0f, 0f, width.toFloat(), height.toFloat(), paint)
                  }

                  // верхняя панель: кнопки инструментов и «скрыть»
                  for (cs in chipSlots()) {
                      val ch = cs.chip
                      if (ch.kind < 2) {
                          paint.color = fx(when {
                              topChip == ch.id -> t.pressed
                              ch.kind == 1 -> t.accent
                              else -> t.special
                          })
                          c.drawRoundRect(cs.r, dp(10f), dp(10f), paint)
                          txt.color = if (ch.kind == 1) t.accentText else t.text
                      } else {
                          txt.color = if (ch.kind == 3) 0xFFFF6B6B.toInt() else t.hint
                      }
                      txt.textSize = dp(13f) * cs.scale
                      var label = ch.label
                      if (ch.kind >= 2) {
                          val n = txt.breakText(label, true, cs.r.width(), null)
                          if (n < label.length) label = label.substring(0, maxOf(0, n - 1)) + "…"
                      }
                      c.drawText(label, cs.r.centerX(), cs.r.centerY() - (txt.ascent() + txt.descent()) / 2, txt)
                  }
                  txt.color = t.hint
                  txt.textSize = dp(18f)
                  c.drawText("⌄", width - dp(24f), topH / 2 + dp(6f), txt)

                  val rad = dp(7f)
                  val kh = keyH()
                  if (svc.panel != 0) {
                      drawPanel(c, t)
                      return
                  }
                  for (s in slots) {
                      val k = s.key
                      paint.color = fx(when {
                          s === pressed -> t.pressed
                          k.kind == Kind.ENTER -> t.accent
                          k.kind == Kind.SHIFT && svc.shift > 0 -> t.text
                          k.kind == Kind.CHAR || k.kind == Kind.SPACE -> t.key
                          else -> t.special
                      })
                      c.drawRoundRect(s.r, rad, rad, paint)
                      drawLabel(c, s, t, kh)
                  }

                  // превью нажатой буквы
                  val ps = pressed
                  if (ps != null && svc.prefs.preview && ps.key.kind == Kind.CHAR && !longFired) {
                      val bw = ps.r.width() * 1.3f
                      val bottom = ps.r.top - dp(2f)
                      val bh = minOf(dp(54f), bottom)
                      if (bh > dp(20f)) {
                          val left = (ps.r.centerX() - bw / 2).coerceIn(dp(2f), maxOf(dp(2f), width - bw - dp(2f)))
                          val r = RectF(left, bottom - bh, left + bw, bottom)
                          paint.color = t.preview
                          c.drawRoundRect(r, dp(10f), dp(10f), paint)
                          txt.color = t.text
                          txt.textSize = bh * 0.6f
                          c.drawText(ps.key.out, r.centerX(), r.centerY() - (txt.ascent() + txt.descent()) / 2, txt)
                      }
                  }
              }

              private fun drawLabel(c: Canvas, s: Slot, t: KbTheme, kh: Float) {
                  val k = s.key
                  val cx = s.r.centerX()
                  val cy = s.r.centerY()
                  when (k.kind) {
                      Kind.BACKSPACE -> drawBackspace(c, cx, cy, t.text)
                      Kind.SHIFT -> {
                          val on = svc.shift > 0
                          drawShift(c, cx, cy, if (on) t.bg else t.text, svc.shift == 2, svc.shift == 2)
                      }
                      else -> {
                          txt.color = when (k.kind) {
                              Kind.ENTER -> t.accentText
                              Kind.SPACE -> t.hint
                              else -> t.text
                          }
                          txt.textSize = when {
                              k.kind == Kind.SPACE -> kh * 0.32f
                              k.small -> kh * 0.38f
                              k.kind == Kind.SYMBOLS || k.kind == Kind.PAGE -> kh * 0.34f
                              else -> kh * 0.46f
                          }
                          c.drawText(k.label, cx, cy - (txt.ascent() + txt.descent()) / 2, txt)

                          // подсказка о долгом нажатии в углу клавиши
                          if (k.kind == Kind.CHAR && !k.small) {
                              val a = alt(k)
                              if (a != null) {
                                  txt.color = t.hint
                                  txt.textSize = kh * 0.24f
                                  c.drawText(a, s.r.right - dp(7f), s.r.top + kh * 0.3f, txt)
                              }
                          }
                      }
                  }
              }

              private fun drawBackspace(c: Canvas, cx: Float, cy: Float, color: Int) {
                  val s = dp(9f)
                  stroke.color = color
                  stroke.strokeWidth = dp(1.8f)
                  val p = Path()
                  p.moveTo(cx - s * 1.1f, cy)
                  p.lineTo(cx - s * 0.35f, cy - s * 0.75f)
                  p.lineTo(cx + s * 1.1f, cy - s * 0.75f)
                  p.lineTo(cx + s * 1.1f, cy + s * 0.75f)
                  p.lineTo(cx - s * 0.35f, cy + s * 0.75f)
                  p.close()
                  c.drawPath(p, stroke)
                  c.drawLine(cx - s * 0.05f, cy - s * 0.3f, cx + s * 0.65f, cy + s * 0.3f, stroke)
                  c.drawLine(cx + s * 0.65f, cy - s * 0.3f, cx - s * 0.05f, cy + s * 0.3f, stroke)
              }

              private fun drawShift(c: Canvas, cx: Float, cy: Float, color: Int, filled: Boolean, lock: Boolean) {
                  val s = dp(9f)
                  val p = Path()
                  p.moveTo(cx, cy - s)
                  p.lineTo(cx + s, cy + s * 0.05f)
                  p.lineTo(cx + s * 0.45f, cy + s * 0.05f)
                  p.lineTo(cx + s * 0.45f, cy + s * 0.75f)
                  p.lineTo(cx - s * 0.45f, cy + s * 0.75f)
                  p.lineTo(cx - s * 0.45f, cy + s * 0.05f)
                  p.lineTo(cx - s, cy + s * 0.05f)
                  p.close()
                  paint.color = color
                  stroke.color = color
                  stroke.strokeWidth = dp(1.8f)
                  if (filled) c.drawPath(p, paint) else c.drawPath(p, stroke)
                  if (lock) c.drawLine(cx - s * 0.45f, cy + s * 1.05f, cx + s * 0.45f, cy + s * 1.05f, stroke)
              }

              // ---------- панели ----------

              private class Geom(
                  val gridTop: Float, val gridBottom: Float, val tabsTop: Float, val tabsBottom: Float,
                  val cols: Int, val cellW: Float, val cellH: Float
              )

              private fun geom(): Geom {
                  val kh = keyH()
                  val top = topH + dp(4f)
                  val bottom = top + rowsCount * (kh + gap) - gap
                  val tabsTop = bottom - kh
                  val cols = maxOf(1, svc.panelCols())
                  val ch = if (cols >= 6) maxOf(kh, dp(40f)) else kh * 0.95f
                  return Geom(top, tabsTop - gap, tabsTop, bottom, cols, width.toFloat() / cols, ch)
              }

              private fun drawPanel(c: Canvas, t: KbTheme) {
                  if (panelVerSeen != svc.panelVer) {
                      panelVerSeen = svc.panelVer
                      panelScroll = 0f
                  }
                  val g = geom()
                  val text = svc.panelText()
                  c.save()
                  c.clipRect(0f, g.gridTop, width.toFloat(), g.gridBottom)
                  if (text != null) {
                      val tp = TextPaint(Paint.ANTI_ALIAS_FLAG)
                      tp.color = t.text
                      tp.textSize = dp(15f)
                      val w = maxOf(50, (width - dp(24f)).toInt())
                      val sl = StaticLayout.Builder.obtain(text, 0, text.length, tp, w).build()
                      panelContentH = sl.height + dp(16f)
                      val maxS = maxOf(0f, panelContentH - (g.gridBottom - g.gridTop))
                      panelScroll = panelScroll.coerceIn(0f, maxS)
                      c.translate(dp(12f), g.gridTop + dp(6f) - panelScroll)
                      sl.draw(c)
                  } else {
                      val cells = svc.panelCells()
                      val rows = (cells.size + g.cols - 1) / g.cols
                      panelContentH = rows * g.cellH + dp(4f)
                      val maxS = maxOf(0f, panelContentH - (g.gridBottom - g.gridTop))
                      panelScroll = panelScroll.coerceIn(0f, maxS)
                      for (i in cells.indices) {
                          val cell = cells[i]
                          val r = i / g.cols
                          val col = i % g.cols
                          val x0 = col * g.cellW
                          val y0 = g.gridTop + r * g.cellH - panelScroll
                          if (y0 + g.cellH < g.gridTop || y0 > g.gridBottom) continue
                          if (cell.kind == 2) {
                              txt.color = t.text
                              txt.textSize = g.cellH * 0.55f
                              c.drawText(cell.label, x0 + g.cellW / 2, y0 + g.cellH / 2 - (txt.ascent() + txt.descent()) / 2, txt)
                          } else {
                              val rect = RectF(x0 + dp(3f), y0 + dp(2f), x0 + g.cellW - dp(3f), y0 + g.cellH - dp(2f))
                              paint.color = fx(if (cell.kind == 1) t.accent else t.key)
                              c.drawRoundRect(rect, dp(8f), dp(8f), paint)
                              if (cell.kind == 3) {
                                  ltxt.color = t.text
                                  ltxt.textSize = dp(14f)
                                  var label = cell.label
                                  val n = ltxt.breakText(label, true, rect.width() - dp(20f), null)
                                  if (n < label.length) label = label.substring(0, maxOf(0, n - 1)) + "…"
                                  c.drawText(label, rect.left + dp(10f), rect.centerY() - (ltxt.ascent() + ltxt.descent()) / 2, ltxt)
                              } else {
                                  txt.color = if (cell.kind == 1) t.accentText else t.text
                                  txt.textSize = dp(13f)
                                  val maxW = rect.width() - dp(8f)
                                  while (txt.measureText(cell.label) > maxW && txt.textSize > dp(9f)) txt.textSize = txt.textSize - dp(0.5f)
                                  c.drawText(cell.label, rect.centerX(), rect.centerY() - (txt.ascent() + txt.descent()) / 2, txt)
                              }
                          }
                      }
                  }
                  c.restore()

                  // нижняя полоса вкладок
                  val tabs = svc.panelTabs()
                  if (tabs.isNotEmpty()) {
                      val tw = width.toFloat() / tabs.size
                      for (i in tabs.indices) {
                          val tab = tabs[i]
                          val rect = RectF(i * tw + dp(2f), g.tabsTop, (i + 1) * tw - dp(2f), g.tabsBottom)
                          paint.color = fx(if (tab.kind == 1) t.accent else t.special)
                          c.drawRoundRect(rect, dp(8f), dp(8f), paint)
                          txt.color = if (tab.kind == 1) t.accentText else t.text
                          txt.textSize = if (tab.label.length <= 2) dp(17f) else dp(12f)
                          val maxW = rect.width() - dp(4f)
                          while (txt.measureText(tab.label) > maxW && txt.textSize > dp(8f)) txt.textSize = txt.textSize - dp(0.5f)
                          c.drawText(tab.label, rect.centerX(), rect.centerY() - (txt.ascent() + txt.descent()) / 2, txt)
                      }
                  }
              }

              private fun panelTap(x: Float, y: Float) {
                  val g = geom()
                  if (y >= g.tabsTop - dp(2f)) {
                      val tabs = svc.panelTabs()
                      if (tabs.isEmpty()) return
                      val i = (x / (width.toFloat() / tabs.size)).toInt().coerceIn(0, tabs.size - 1)
                      feedback()
                      svc.onCell(tabs[i].id)
                      return
                  }
                  if (y < g.gridTop || y > g.gridBottom || svc.panelText() != null) return
                  val cells = svc.panelCells()
                  val r = ((y - g.gridTop + panelScroll) / g.cellH).toInt()
                  val col = (x / g.cellW).toInt().coerceIn(0, g.cols - 1)
                  val idx = r * g.cols + col
                  if (r >= 0 && idx in cells.indices) {
                      feedback()
                      svc.onCell(cells[idx].id)
                  }
              }

              // ---------- долгое нажатие ----------

              /** Что вводится долгим нажатием на клавишу (или null). */
              private fun alt(k: Key): String? {
                  if (k.kind != Kind.CHAR || k.small) return null
                  val base = k.out.lowercase()
                  val sp = Layouts.longPress[svc.lang]?.get(base)
                  if (sp != null) return if (k.out != base) sp.uppercase() else sp
                  if (k.out == "." && !svc.prefs.commaKey && !svc.symbols) return ","
                  if (!svc.prefs.numberRow && !svc.symbols) {
                      val i = Layouts.topRowIndex(svc.lang, base)
                      if (i >= 0) return "1234567890"[i].toString()
                  }
                  return null
              }

              private val longRun = Runnable {
                  val s = pressed
                  if (s != null) {
                      val k = s.key
                      if (k.kind == Kind.LANG) {
                          longFired = true
                          svc.showPicker()
                          pressed = null
                          invalidate()
                      } else {
                          val a = alt(k)
                          if (a != null) {
                              longFired = true
                              feedback()
                              svc.type(a)
                              invalidate()
                          }
                      }
                  }
              }

              private val repeatRun = object : Runnable {
                  override fun run() {
                      if (pressed?.key?.kind == Kind.BACKSPACE && !delSwiped) {
                          repN++
                          if (svc.prefs.wordDel && repN > 12) {
                              svc.deleteWord()
                              uiHandler.postDelayed(this, 160)
                          } else {
                              svc.backspace()
                              uiHandler.postDelayed(this, 50)
                          }
                      }
                  }
              }

              private val cursorRun = Runnable {
                  val s = pressed
                  if (s != null && s.key.kind == Kind.SPACE && spaceMode == 0) {
                      spaceMode = 1
                      spaceMoved = false
                      spaceAnchor = lastX
                      feedback()
                      invalidate()
                  }
              }

              // ---------- касания ----------

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_POINTER_DOWN -> {
                          if (pressed != null || topTap || panelTouch) release(true)
                          val i = e.actionIndex
                          pid = e.getPointerId(i)
                          press(e.getX(i), e.getY(i))
                      }
                      MotionEvent.ACTION_MOVE -> {
                          val i = e.findPointerIndex(pid)
                          if (i >= 0) slide(e.getX(i), e.getY(i))
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_POINTER_UP -> {
                          val i = e.actionIndex
                          if (e.getPointerId(i) == pid) {
                              lastX = e.getX(i)
                              lastY = e.getY(i)
                              release(true)
                              pid = -1
                          }
                      }
                      MotionEvent.ACTION_CANCEL -> {
                          release(false)
                          pid = -1
                      }
                  }
                  return true
              }

              private fun find(x: Float, y: Float): Slot? {
                  var best: Slot? = null
                  var bd = Float.MAX_VALUE
                  for (s in slots) {
                      val dx = maxOf(s.r.left - x, 0f, x - s.r.right)
                      val dy = maxOf(s.r.top - y, 0f, y - s.r.bottom)
                      val dd = dx * dx + dy * dy
                      if (dd < bd) {
                          bd = dd
                          best = s
                      }
                  }
                  val tol = dp(10f)
                  return if (bd <= tol * tol) best else null
              }

              private fun press(x: Float, y: Float) {
                  longFired = false
                  lastX = x
                  lastY = y
                  if (y < topH) {
                      topTap = true
                      topChip = topAt(x)
                      invalidate()
                      return
                  }
                  if (svc.panel != 0) {
                      panelTouch = true
                      pDownX = x
                      pDownY = y
                      pMoved = false
                      panelScrollStart = panelScroll
                      return
                  }
                  val s = find(x, y) ?: return
                  pressed = s
                  feedback()
                  val k = s.key
                  val ms = svc.prefs.longMs.toLong()
                  if (k.kind == Kind.BACKSPACE) {
                      svc.backspace()
                      repN = 0
                      delSwiped = false
                      delAnchor = x
                      uiHandler.postDelayed(repeatRun, 400)
                  } else if (k.kind == Kind.SPACE) {
                      spaceMode = 0
                      spaceMoved = false
                      spaceX0 = x
                      if (svc.prefs.spaceCursor) uiHandler.postDelayed(cursorRun, ms)
                  } else if (alt(k) != null || k.kind == Kind.LANG) {
                      uiHandler.postDelayed(longRun, ms)
                  }
                  invalidate()
              }

              private fun slide(x: Float, y: Float) {
                  lastX = x
                  lastY = y
                  if (panelTouch) {
                      if (Math.abs(y - pDownY) > dp(8f)) pMoved = true
                      if (pMoved) {
                          val g = geom()
                          val maxS = maxOf(0f, panelContentH - (g.gridBottom - g.gridTop))
                          panelScroll = (panelScrollStart + (pDownY - y)).coerceIn(0f, maxS)
                          invalidate()
                      }
                      return
                  }
                  val cur = pressed ?: return
                  if (cur.key.kind == Kind.BACKSPACE) {
                      // свайп влево от backspace удаляет слова
                      if (svc.prefs.swipeDel && !delSwiped && delAnchor - x > dp(40f)) {
                          delSwiped = true
                          uiHandler.removeCallbacks(repeatRun)
                      }
                      if (delSwiped) {
                          while (delAnchor - x > dp(40f)) {
                              svc.deleteWord()
                              delAnchor -= dp(40f)
                          }
                          if (x > delAnchor) delAnchor = x
                      }
                      return
                  }
                  if (cur.key.kind == Kind.SPACE && spaceMode != 0) {
                      if (spaceMode == 1) {
                          val step = dp(14f)
                          while (x - spaceAnchor > step) {
                              svc.moveCursor(1)
                              spaceAnchor += step
                              spaceMoved = true
                          }
                          while (spaceAnchor - x > step) {
                              svc.moveCursor(-1)
                              spaceAnchor -= step
                              spaceMoved = true
                          }
                      }
                      return
                  }
                  if (cur.key.kind == Kind.SPACE && svc.prefs.spaceLang && Math.abs(x - spaceX0) > dp(70f)) {
                      uiHandler.removeCallbacks(cursorRun)
                      spaceMode = 2
                      feedback()
                      svc.switchLang(if (x > spaceX0) 1 else -1)
                      invalidate()
                      return
                  }
                  val s = find(x, y) ?: return
                  if (s !== cur) {
                      uiHandler.removeCallbacks(longRun)
                      uiHandler.removeCallbacks(cursorRun)
                      longFired = false
                      pressed = s
                      val ms = svc.prefs.longMs.toLong()
                      if (alt(s.key) != null) uiHandler.postDelayed(longRun, ms)
                      invalidate()
                  }
              }

              private fun release(commit: Boolean) {
                  uiHandler.removeCallbacks(longRun)
                  uiHandler.removeCallbacks(repeatRun)
                  uiHandler.removeCallbacks(cursorRun)
                  val s = pressed
                  pressed = null
                  if (topTap) {
                      topTap = false
                      val id = topChip
                      topChip = null
                      if (commit && id != null && topAt(lastX) == id) {
                          feedback()
                          if (id == "hide") svc.requestHideSelf(0) else svc.onTool(id)
                      }
                      invalidate()
                      return
                  }
                  if (panelTouch) {
                      panelTouch = false
                      if (commit && !pMoved) panelTap(lastX, lastY)
                      invalidate()
                      return
                  }
                  val spaceSkip = s != null && s.key.kind == Kind.SPACE &&
                          (spaceMode == 2 || (spaceMode == 1 && spaceMoved))
                  if (commit && s != null && !longFired && s.key.kind != Kind.BACKSPACE && !spaceSkip) act(s.key)
                  spaceMode = 0
                  spaceMoved = false
                  longFired = false
                  invalidate()
              }

              private fun act(k: Key) {
                  when (k.kind) {
                      Kind.CHAR -> svc.type(k.out)
                      Kind.SPACE -> svc.type(" ")
                      Kind.SHIFT -> svc.onShift()
                      Kind.SYMBOLS -> svc.toggleSymbols()
                      Kind.PAGE -> svc.togglePage()
                      Kind.LANG -> svc.nextLang()
                      Kind.ENTER -> svc.enter()
                      else -> {}
                  }
              }

              @Suppress("DEPRECATION")
              private fun feedback() {
                  if (svc.prefs.vibrate) {
                      performHapticFeedback(
                          HapticFeedbackConstants.KEYBOARD_TAP,
                          HapticFeedbackConstants.FLAG_IGNORE_GLOBAL_SETTING
                      )
                  }
                  if (svc.prefs.sound) playSoundEffect(SoundEffectConstants.CLICK)
              }
          }
          HRN_EOF
          mkdir -p "$(dirname 'app/src/main/java/ru/horrons/keyboard/Layouts.kt')"
          cat > 'app/src/main/java/ru/horrons/keyboard/Layouts.kt' <<'HRN_EOF'
