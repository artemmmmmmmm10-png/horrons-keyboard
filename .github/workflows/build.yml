                      setOnClickListener {
                          (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker()
                      }
                  })
                  root.addView(EditText(this).apply {
                      hint = "Проверь клавиатуру здесь"
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_CAP_SENTENCES
                  })

                  // 2. Темы
                  root.addView(title("Тема"))
                  val group = RadioGroup(this)
                  val themeNames = Themes.all.map { it.name } + "Своя (задай цвета ниже)"
                  themeNames.forEachIndexed { i, n ->
                      group.addView(RadioButton(this).apply {
                          id = View.generateViewId()
                          text = n
                          isChecked = i == p.theme
                          setOnClickListener { p.theme = i }
                      })
                  }
                  root.addView(group)
                  fun hexField(label: String, value: String, onChange: (String) -> Unit) {
                      root.addView(TextView(this).apply {
                          text = label
                          setPadding(0, 8.dp(), 0, 0)
                      })
                      root.addView(EditText(this).apply {
                          setText(value)
                          inputType = InputType.TYPE_CLASS_TEXT
                          setSingleLine()
                          addTextChangedListener(object : TextWatcher {
                              override fun afterTextChanged(s: Editable?) {
                                  onChange(s?.toString()?.trim() ?: "")
                              }

                              override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                              override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                          })
                      })
                  }
                  root.addView(note("Своя тема: впиши цвета в формате #RRGGBB, например #202A44. Остальные оттенки подберутся сами."))
                  hexField("Цвет фона", p.customBg) { p.customBg = it }
                  hexField("Цвет акцента (кнопка ввода, выделение)", p.customAccent) { p.customAccent = it }

                  // 3. Высота
                  val heightLabel = TextView(this)
                  fun updHeight() {
                      heightLabel.text = "Высота клавиш: ${p.height}%"
                  }
                  updHeight()
                  root.addView(title("Размер"))
                  root.addView(heightLabel)
                  root.addView(SeekBar(this).apply {
                      max = 60
                      progress = p.height - 70
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(sb: SeekBar, value: Int, fromUser: Boolean) {
                              p.height = 70 + value
                              updHeight()
                          }

                          override fun onStartTrackingTouch(sb: SeekBar) {}
                          override fun onStopTrackingTouch(sb: SeekBar) {}
                      })
                  })

                  // 4. Языки
                  root.addView(title("Языки"))
                  root.addView(note("Отметь нужные языки. Стрелки ↑ ↓ меняют порядок переключения."))
                  val search = EditText(this).apply {
                      hint = "Поиск языков"
                      setSingleLine()
                  }
                  val langBox = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

                  fun renderLangs() {
                      langBox.removeAllViews()
                      val q = search.text.toString().trim().lowercase()
                      val chosen = p.langs.filter { it in Layouts.all }
                      val ordered = chosen + Layouts.all.filter { it !in chosen }
                      for (code in ordered) {
                          val name = Layouts.names[code] ?: code
                          if (q.isNotEmpty() && !name.lowercase().contains(q)) continue
                          val row = LinearLayout(this).apply {
                              orientation = LinearLayout.HORIZONTAL
                              gravity = Gravity.CENTER_VERTICAL
                          }
                          val cb = CheckBox(this).apply {
                              text = name
                              isChecked = code in chosen
                          }
                          row.addView(cb, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
