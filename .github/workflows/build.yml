              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != 77 || resultCode != RESULT_OK) return
                  val uri = data?.data ?: return
                  try {
                      val opts = BitmapFactory.Options()
                      opts.inJustDecodeBounds = true
                      contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, opts) }
                      var sample = 1
                      while (opts.outWidth / sample > 1400 || opts.outHeight / sample > 1400) sample *= 2
                      val o2 = BitmapFactory.Options()
                      o2.inSampleSize = sample
                      val bmp = contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, o2) }
                      if (bmp == null) {
                          Toast.makeText(this, "Не удалось открыть картинку", Toast.LENGTH_SHORT).show()
                          return
                      }
                      File(filesDir, "bg.jpg").outputStream().use { bmp.compress(Bitmap.CompressFormat.JPEG, 88, it) }
                      p.bgImage = true
                      Toast.makeText(this, "Фон установлен", Toast.LENGTH_SHORT).show()
                  } catch (e: Exception) {
                      Toast.makeText(this, "Не удалось установить фон", Toast.LENGTH_SHORT).show()
                  }
              }
