          package ru.horrons.keyboard

          import android.graphics.Color

          private fun c(s: String): Int = Color.parseColor(s)

          class KbTheme(
              val name: String,
              val bg: Int,
              val key: Int,
              val special: Int,
              val text: Int,
              val hint: Int,
              val accent: Int,
              val accentText: Int,
              val pressed: Int,
              val preview: Int
          )

          object Themes {
              val all: List<KbTheme> = listOf(
                  KbTheme("Тёмная", c("#1C1C1F"), c("#3B3B40"), c("#2B2B2F"), c("#F2F2F4"), c("#8E8E96"), c("#FFD27F"), c("#1A0F05"), c("#5A5A62"), c("#5A5A62")),
                  KbTheme("Светлая", c("#D9DCE1"), c("#FFFFFF"), c("#B9BEC7"), c("#1B1B1F"), c("#6B6F78"), c("#FFCC33"), c("#1B1B1F"), c("#C5C9D1"), c("#FFFFFF")),
                  KbTheme("Ночь (AMOLED)", c("#000000"), c("#1A1A1A"), c("#0F0F0F"), c("#FFFFFF"), c("#777777"), c("#3DDC84"), c("#001A0A"), c("#333333"), c("#2A2A2A")),
                  KbTheme("Синяя", c("#0F1B33"), c("#22355C"), c("#18284A"), c("#EAF1FF"), c("#8FA6D6"), c("#4A8AFF"), c("#FFFFFF"), c("#3A5188"), c("#3A5188")),
                  KbTheme("Зелёная", c("#0E2217"), c("#1E4430"), c("#143222"), c("#E8FFF1"), c("#8FC9A6"), c("#3DDC84"), c("#04210F"), c("#2F6A4A"), c("#2F6A4A")),
                  KbTheme("Рогатый (красная)", c("#1A0808"), c("#3A1412"), c("#2A0D0C"), c("#FFE9E6"), c("#C98F89"), c("#E5484D"), c("#FFFFFF"), c("#6A2622"), c("#6A2622")),
                  KbTheme("Фиолетовая", c("#1B1030"), c("#33215C"), c("#251645"), c("#F1EAFF"), c("#A996D6"), c("#9B6BFF"), c("#FFFFFF"), c("#4D3688"), c("#4D3688")),
                  KbTheme("Розовая", c("#2A0F1E"), c("#4F1D38"), c("#3A1429"), c("#FFE8F3"), c("#D69AB8"), c("#FF5FA2"), c("#FFFFFF"), c("#7A2D55"), c("#7A2D55")),
                  KbTheme("Золотая", c("#1F1A0E"), c("#3D3418"), c("#2D2610"), c("#FFF6D6"), c("#C9B26B"), c("#F5B700"), c("#1F1600"), c("#5E5026"), c("#5E5026")),
                  KbTheme("Серая", c("#2B2D31"), c("#44474D"), c("#35373C"), c("#F2F3F5"), c("#9A9DA5"), c("#7FB2FF"), c("#0B1A33"), c("#5C6068"), c("#5C6068"))
              )

              private fun parse(s: String, def: Int): Int = try {
                  Color.parseColor(s.trim().let { if (it.startsWith("#")) it else "#$it" })
              } catch (e: Exception) {
                  def
              }

              private fun mix(a: Int, b: Int, t: Float): Int {
                  val r = (Color.red(a) + (Color.red(b) - Color.red(a)) * t).toInt()
                  val g = (Color.green(a) + (Color.green(b) - Color.green(a)) * t).toInt()
                  val bl = (Color.blue(a) + (Color.blue(b) - Color.blue(a)) * t).toInt()
                  return Color.rgb(r, g, bl)
              }

              private fun lum(x: Int): Float = (0.299f * Color.red(x) + 0.587f * Color.green(x) + 0.114f * Color.blue(x)) / 255f

              /** Своя тема: из двух цветов (фон и акцент) выводятся остальные. */
              fun custom(bgHex: String, accentHex: String): KbTheme {
                  val bg = parse(bgHex, c("#202A44"))
                  val ac = parse(accentHex, c("#FF8A3D"))
                  val dark = lum(bg) < 0.5f
                  val text = if (dark) c("#F2F2F4") else c("#1B1B1F")
                  val key = if (dark) mix(bg, Color.WHITE, 0.14f) else mix(bg, Color.WHITE, 0.7f)
                  val special = if (dark) mix(bg, Color.WHITE, 0.06f) else mix(bg, Color.BLACK, 0.1f)
                  val pressed = mix(key, text, 0.2f)
                  return KbTheme(
                      "Своя", bg, key, special, text, mix(bg, text, 0.55f), ac,
                      if (lum(ac) > 0.55f) c("#1B1B1F") else Color.WHITE, pressed, pressed
                  )
              }

              fun get(i: Int): KbTheme = all[i.coerceIn(0, all.lastIndex)]
          }
          HRN_EOF
          mkdir -p "$(dirname 'app/src/main/java/ru/horrons/keyboard/Tr.kt')"
          cat > 'app/src/main/java/ru/horrons/keyboard/Tr.kt' <<'HRN_EOF'
          package ru.horrons.keyboard

          import com.google.mlkit.common.model.DownloadConditions
          import com.google.mlkit.nl.translate.Translation
          import com.google.mlkit.nl.translate.Translator
          import com.google.mlkit.nl.translate.TranslatorOptions

          /** Перевод на телефоне через Google ML Kit. Языковые модели скачиваются при первом использовании. */
          object Tr {
              private val cache = HashMap<String, Translator>()

              /** Грубо определяет язык: кириллица (ru или uk) либо латиница (en). */
              fun detect(text: String): String {
                  var cyr = 0
                  var lat = 0
                  var uk = false
                  for (ch in text) {
                      if ("іїєґІЇЄҐ".indexOf(ch) >= 0) {
                          cyr++
                          uk = true
                      } else if (ch in 'а'..'я' || ch in 'А'..'Я' || ch == 'ё' || ch == 'Ё') {
                          cyr++
                      } else if (ch in 'a'..'z' || ch in 'A'..'Z') {
                          lat++
                      }
                  }
                  return if (cyr > lat) (if (uk) "uk" else "ru") else "en"
              }

              /** Колбэк вызывается в главном потоке: (результат, ошибка). */
              fun translate(text: String, srcPref: String, dst: String, cb: (String?, String?) -> Unit) {
                  val src = if (srcPref == "auto") detect(text) else srcPref
                  if (src == dst) {
                      cb(null, "Язык текста и язык перевода совпадают. Нажмите «→ ${dst.uppercase()}» и выберите другой.")
                      return
                  }
                  try {
                      val key = "$src>$dst"
                      val tr = cache.getOrPut(key) {
                          Translation.getClient(
                              TranslatorOptions.Builder()
                                  .setSourceLanguage(src)
                                  .setTargetLanguage(dst)
                                  .build()
                          )
                      }
                      tr.downloadModelIfNeeded(DownloadConditions.Builder().build())
                          .addOnSuccessListener {
                              tr.translate(text)
                                  .addOnSuccessListener { result -> cb(result, null) }
                                  .addOnFailureListener { cb(null, "Не удалось перевести") }
                          }
                          .addOnFailureListener {
                              cb(null, "Не удалось скачать язык. Проверьте интернет.")
                          }
                  } catch (e: Exception) {
                      cb(null, "Перевод недоступен на этом телефоне")
                  }
              }
          }
          HRN_EOF
